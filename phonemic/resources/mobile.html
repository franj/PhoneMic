                                this.ws.close();
                            }
                            return;
                        }

                        // 已认证：下行数据帧（整帧密文），解密失败即丢弃
                        let inner;
                        try {
                            inner = this.secure.decrypt(rawBytes);
                        } catch (e) {
                            console.error('[SEC] Decrypt failed:', e);
                            return;
                        }

                        if (!this.isConnected) {
                            this.isConnected = true;
                            this._notifyStatusChange(true);
                        }
                        // 无人接住才告警：多订阅者之后「没注册」往往只是「合法地不关心」
                        if (!this.hub.emit(inner.type, inner)) {
                            console.warn(t('log_ws_unknown_type'), inner.type);
                        }
                    } catch (err) { console.error(t('log_ws_parse_error'), err); }
                };
                this.ws.onclose = (ev) => {
                    this._clearConnectTimer();
                    const t3 = Date.now();
                    // 关闭码是判断「谁断的、为什么断」的唯一可靠线索，必须留痕：
                    //   1000 = 服务端主动 close（如加密模式解密/seq 失步、配置变更）
                    //   1006 = 网络层断开，没收到关闭帧（Wi-Fi/蜂窝切换、代理掐断）
                    //   1011 = 服务端应用层保活超时（空闲 60s 无任何消息才判死；
                    //          传输中数据帧会刷新时间戳，故上传大文件不会触发）
                    //          见 wire-protocol.md §7 ping/pong
                    // stale=true 表示这是「旧 socket 的迟到事件」，它会污染新连接的状态
                    const code = ev && ev.code;
                    const reason = (ev && ev.reason) || '';
                    const stale = !!(ev && ev.target && this.ws !== ev.target);
                    // 断连当下的网络/可见性现场：1006 只能说明「没收到关闭帧」，
                    // 到底是网络断了还是页面被冻住/被回收，全靠这两个字段区分
                    const life = (window.PhoneLog && PhoneLog.snap) ? PhoneLog.snap() : '';
                    console.warn('[WS] closed', `code=${code}`, `reason=${reason || '-'}`,
                                 `clean=${ev && ev.wasClean}`, `lifetime=${t3 - t0}ms`, `stale=${stale}`,
                                 life);
                    console.info(t('log_ws_disconnected'), `(${t3 - t0}ms)`);
                    // 关闭现场留档：弹窗会盖住状态栏，只有记下来才能事后带出去
                    this._lastClose = {
                        code, reason, clean: !!(ev && ev.wasClean),
                        lifetime: t3 - t0, stale, at: t3, life,
                    };
                    this.isConnected = false;
                    this.secure._authenticated = false;
                    // 连接结束：撤掉审批等待计时器与识别码浮层（下面各分支自行决定提示文案）
                    this._clearAuthChallengeTimer();
                    this._hideApprovalWait();
                    // 事务级断连信号：先于下面那套「要不要告诉界面」的判断发出，且与它无关。
                    // 静默宽限期只决定**界面表不表态**，改变不了「这条连接已经断了」的事实
                    // —— 正在等 ack 的那个传输必须据此立刻收尾，不能陪着等宽限期。
                    // stale（旧 socket 的迟到 onclose）不发：那不代表当前连接断了。
                    if (!stale) this.hub.emit(WS_CLOSE, { code, reason });
                    // 4001 = 握手认证失败（SealedBox 解封失败、algo 不在列表等）
                    // 4001 + 本地存有 PC 公钥 = PC 侧密钥已变更（重启/换模式），
                    // 旧公钥作废 → 清除本地公钥并自动重连，走 TOFU 首次路径重新审批。
                    // 无需用户手动操作（e2ee-always-on-design.md §8.6）。
                    if (code === 4001 && this.secure.authMode === 'tofu_reconnect') {
                        this.secure.clearStoredKey();
                        this._notifyStatusChange(false, t('auth_key_changed_text'));
                        this._scheduleReconnect();
                        return;
                    }
                    // 4001（无本地公钥）/ 4032（TOFU 审批被拒绝或超时）：重试结果相同，
                    // 停止自动重连并提示用户
                    if ((code === 4001 || code === 4032) && !this.authRejected) {
                        this.authRejected = true;
                        if (code === 4032) {
                            // 审批失败：清掉可能残留的公钥，下次重新走首次流程
                            this.secure.clearStoredKey();
                        }
                        this._showAuthRejected(true, code);
                    }
                    if (this.authRejected) return; // 保持认证失败提示，不再自动重连
                    // 只有「唤起文件选择器」这条路径的断连才进静默窗口（见 _startGrace）；
                    // 窗口内（_graceSilent）后续的断连也继续静默，别让重试抖动露到界面上。
                    // 其余一切断连照常上报——界面该禁用就禁用，免得用户的操作静默失败。
                    if (this._inPickerContext() || this._graceSilent) this._startGrace();
                    else this._surfaceDisconnected();
                    this._scheduleReconnect();
                };
                this.ws.onerror = (err) => {
                    const t4 = Date.now();
                    console.error('WS error at', t4 - t0, 'ms:', err);
                    // 界面表现统一交给随后必然触发的 onclose（它决定静默还是如实上报），
                    // 这里再写状态栏只会让「连接错误」抢在前面露出来
                    this.ws.close();
                };
            } catch (err) {
                this._clearConnectTimer();
                console.error(err);
                this._scheduleReconnect();
            }
        }
        _scheduleReconnect() {
            if (this.reconnectTimer) clearTimeout(this.reconnectTimer);
            if (this._skipNextDelay) {
                this._skipNextDelay = false;
                this.connect();
            } else {
                this.reconnectTimer = setTimeout(() => this.connect(), this.reconnectInterval);
            }
        }
        /**
         * 等待连接就绪（含加密认证完成），最多 timeoutMs。
         *
         * 「刚回前台」「刚选完文件」这两种时刻，连接多半正处在 1s 重连窗口里断着，
         * 但马上就会好。直接拿 getConnected() 判定会误报「未连接到电脑」，
         * 所以先等一会儿再下结论。
         * @param {number} timeoutMs
         * @returns {Promise<boolean>}
         */
        whenReady(timeoutMs = 6000) {
            if (this.getConnected()) return Promise.resolve(true);
            // 断着且没有重连计划（定时器已错过或从未排上）：立刻催一次，别干等
            if (!this.reconnectTimer) this.reconnectNow('whenReady');
            return new Promise((resolve) => {
                let timer = null;
                let done = false;
                // 注销句柄就是 on() 的返回值本身：不再需要记住原函数引用去配对移除
                const off = this.on(WS_STATUS, (st) => {
                    if (st && st.connected) finish(true);
                });
                function finish(ok) {
                    if (done) return;
                    done = true;
                    clearTimeout(timer);
                    off();
                    resolve(ok);
                }
                timer = setTimeout(() => finish(this.getConnected()), timeoutMs);
                if (this.getConnected()) finish(true);   // 事件可能在注册前刚发过
            });
        }
        /**
         * 立即重连，跳过 1s 退避。
         *
         * 断线恢复的两条快路径（网络恢复 online、页面回前台 visibilitychange）都走这里：
         * Android WebView 切后台（唤起文件选择器、熄屏、被别的 Activity 顶掉）期间
         * 系统常顺手掐掉 socket，两端都收不到关闭帧、只剩 1006。回前台时若还等退避，
         * 用户「选完文件回来」就会正好撞上未连接窗口。
         */
        reconnectNow(reason) {
            if (this.authRejected) return;
            if (this.getConnected()) return;
            if (this.reconnectTimer) {
                clearTimeout(this.reconnectTimer);
                this.reconnectTimer = null;
            }
            if (this.ws) {
                if (this.ws.readyState === WebSocket.CONNECTING) {
                    // 卡在握手里的旧连接：关掉它，让 onclose 走「跳过延迟」快路径重连
                    this._skipNextDelay = true;
                    try { this.ws.close(); } catch (e) {}
                    return;
                }
                if (this.ws.readyState === WebSocket.OPEN) return;  // 已连上，只差认证收尾
            }
            console.debug(`[WS] reconnectNow (${reason})`);
            this.connect();
        }
        _notifyStatusChange(connected, message) {
            // 连上了：宽限窗口立即作废。若窗口此前已超时，这次通知同时把界面恢复正常。
            if (connected) this._stopGrace();
            // 走 hub，不再走 document 上的 CustomEvent：连接状态本就是传输层的信号，
            // 没理由绕一趟 DOM 再让订阅者从 e.detail 里把它抠出来。
            // 顺带一个实际好处：订阅拿到的是**注销函数**，不再需要自己记住原函数引用
            // 才能 removeEventListener（那是 whenReady 里唯一需要手工配对的地方）。
            this.hub.emit(WS_STATUS, { connected, message });
        }
        /**
         * TOFU 首次：启动 auth_challenge 等待计时器（自 auth 发出起算）。
         *
         * 这份 35s 预算覆盖「第 2 步 sealed」与「第 4 步挑战」两段等待：
         * PC 端要等用户核对识别码并点「接受」，30s 审批超时是常态上限，故这里取
         * APPROVAL_TIMEOUT + 5s 容错。合并成一份预算是有意的——第 2 步是纯机器
         * 往返（下行一张帧），正常毫秒级返回，吃不掉人工核对的份额；若它迟迟不来，
         * 同一个 35s 上限一样会把它判死。超时即主动断开，把结论明确告诉用户
         * （而不是无限等一个可能永远不来的挑战）。
         */
        _startAuthChallengeTimer() {
            this._clearAuthChallengeTimer();
            this._authChallengeTimer = setTimeout(() => {
                this._authChallengeTimer = null;
                console.warn('[SEC] TOFU: auth_challenge timeout, closing');
                this._notifyStatusChange(false, t('auth_approval_timeout_text'));
                if (this.ws) {
                    try { this.ws.close(); } catch (e) {}
                }
            }, AUTH_CHALLENGE_TIMEOUT_MS);
        }
        _clearAuthChallengeTimer() {
            if (this._authChallengeTimer) {
                clearTimeout(this._authChallengeTimer);
                this._authChallengeTimer = null;
            }
        }
        /** 显示审批等待浮层（识别码大字 + 提示）。 */
        _showApprovalWait(pin) {
            const overlay = document.getElementById('approval-overlay');
            if (!overlay) return;
            const titleEl = document.getElementById('approval-title');
            const pinEl = document.getElementById('approval-pin');
            const hintEl = document.getElementById('approval-hint');
            if (titleEl) titleEl.textContent = t('auth_approval_title');
            if (pinEl) pinEl.textContent = pin || '----';
            if (hintEl) hintEl.textContent = t('auth_approval_hint');
            overlay.classList.add('visible');
        }
        _hideApprovalWait() {
            const overlay = document.getElementById('approval-overlay');
            if (overlay) overlay.classList.remove('visible');
        }
        _showAuthRejected(hasKey, closeCode) {
            let text;
            if (closeCode === 4032) {
                text = t('auth_tofu_rejected_text');
            } else if (hasKey) {
                text = t('auth_rejected_text');
            } else {
                text = t('auth_nokey_text');
                // 仅"页面缺少密钥"与微信内置浏览器丢失 hash 相关，认证失败与浏览器无关不提示
                if (/MicroMessenger/i.test(navigator.userAgent)) {
                    text += '。' + t('auth_wechat_hint');
                }
            }
            this._notifyStatusChange(false, text);
        }
        _showRescanRequired() {
            // PC 端配置变更与浏览器无关，不追加微信提示
            this._notifyStatusChange(false, t('auth_reconfig_text'));
        }
        /**
         * 发送一个完整帧（字段平铺在帧顶层，不加 payload 包装）。
         * 鼠标/键盘面板走这里：{type:"mouse", a:"click", btn:"left"}。
         */
        sendFrame(frame) {
            if (!this.isConnected || !this.isOpen()) return false;
            // encrypt 已产出线上字节（整帧加密），直接上帧
            this.ws.send(this.secure.encrypt(frame));
            return true;
        }
        send(type, text) {
            return this.sendFrame({ type, text });
        }
        getConnected() { return this.isConnected; }

        /**
         * 原始 socket 是否可写。
         *
         * 存在的意义是不再让面板伸手去摸 `wsClient.ws.readyState`：`ws` 是传输层的私产，
         * 面板一碰就与「重连时整个换掉 socket 对象」这条实现细节绑死了（见 §6.5）。
         */
        isOpen() { return !!this.ws && this.ws.readyState === WebSocket.OPEN; }

        /**
         * 发送缓冲积压字节数（`bufferedAmount` 的转发）。
         *
         * 无 socket、或该实现没有这个属性（测试用的 mock 就没有）时按 0 返回 ——
         * 免得调用方拿到 `undefined` 去做算术，NaN 一路把进度条拖下水。
         */
        bufferedAmount() {
            return (this.ws && typeof this.ws.bufferedAmount === 'number')
                ? this.ws.bufferedAmount : 0;
        }

        /**
         * 最近一次断连的单行摘要。
         * 手机端没有 console，而弹窗又会盖住状态栏，偶发断连想把关闭码带出来
         * 只能靠它随弹窗一起显示。
         */
        diagText() {
            const c = this._lastClose;
            if (!c) return this.isConnected ? '' : '(no close event)';
            const clock = new Date(c.at).toTimeString().slice(0, 8);   // 与 PC 端日志对时间用
            const parts = [`code=${c.code}`, `clean=${c.clean}`, `${(c.lifetime / 1000).toFixed(1)}s`,
                           `at=${clock}`];
            if (c.reason) parts.push(`reason=${c.reason}`);
            if (c.stale) parts.push('stale');
            if (c.life) parts.push(c.life);
            return '(' + parts.join(', ') + ')';
        }
    }

    // ========== 5. 消息交互管理器 ==========
    class MessageInteractionManager {
        constructor(chatContainer, uiController, wsClient) {
            this.container = chatContainer;
            this.ui = uiController;
            this.wsClient = wsClient;
            this.pressTimer = null;
            this.longPressTriggered = false;
            this.currentMsg = null;
            this.init();
        }
        init() {
            this.container.addEventListener('touchstart', this._onStart.bind(this), { passive: false });
            this.container.addEventListener('touchend', this._onEnd.bind(this));
            this.container.addEventListener('touchmove', this._onCancel.bind(this));
            this.container.addEventListener('touchcancel', this._onCancel.bind(this));
            this.container.addEventListener('mousedown', this._onStart.bind(this));
            this.container.addEventListener('mouseup', this._onEnd.bind(this));
            this.container.addEventListener('mouseleave', this._onCancel.bind(this));
            this.container.addEventListener('click', (e) => {
                const msg = e.target.closest('.message');
                if (!msg) return;
                if (this.longPressTriggered) {
                    this.longPressTriggered = false;
                    return;
                }
                // 文件气泡：取消/失败的点击 → 确认后重发同一文件（完成态不响应）
                if (msg.dataset.kind === 'file') {
                    if (msg.classList.contains('file-cancel') && msg._fileRef && window._filePanel) {
                        if (confirm(t('confirm_resend_file'))) {
                            window._filePanel.resend(msg._fileRef);
                        }
                    }
                    return;
                }
                // 图片气泡（photo）：到电脑剪贴板的结果展示，不参与重发
                if (msg.dataset.kind === 'photo') return;
                if (!this.wsClient.getConnected()) return;
                if (confirm(t('confirm_resend'))) {
                    this.ui.sendExternalMessage(msg.textContent);
                }
            });
        }
        _onStart(e) {
            const msg = e.target.closest('.message');
            if (!msg) return;
            // 文件/图片结果气泡不参与长按取词/拼接输入
            if (msg.dataset.kind === 'file' || msg.dataset.kind === 'photo') return;
            this.currentMsg = msg;
            this.currentMsg.classList.add('active');
            this.longPressTriggered = false;
            this.pressTimer = setTimeout(() => {
                if (this.currentMsg && this.wsClient.getConnected()) {
                    const addedText = this.currentMsg.textContent;
                    const currentInput = this.ui.inputBox.value;
                    const newValue = currentInput + addedText;
                    this.ui.inputBox.value = newValue;
                    this.ui.adjustHeight();
                    this.ui.wsClient.send('preview', newValue);
                    this.ui.updateModeToggleVisibility();
                    if (navigator.vibrate) navigator.vibrate(30);
                    this.longPressTriggered = true;
                }
                this._clearHighlight();
            }, 500);
        }
        _onEnd(e) {
            if (this.pressTimer) clearTimeout(this.pressTimer);
            this._clearHighlight();
            if (this.longPressTriggered) {
                if (e.cancelable) e.preventDefault();
                this.ui.inputBox.focus();
                this.longPressTriggered = false;
            }
            this.currentMsg = null;
        }
        _onCancel() {
            if (this.pressTimer) clearTimeout(this.pressTimer);
            this._clearHighlight();
            this.longPressTriggered = false;
            this.currentMsg = null;
        }
        _clearHighlight() {
            if (this.currentMsg) this.currentMsg.classList.remove('active');
        }
    }

    // ========== 6. UI 控制器 ==========
    class UIController {
        constructor(inputElement, sendButton, clearButton, modeToggleButton, chatManager, wsClient, configManager) {
            this.inputBox = inputElement;
            this.btnSend = sendButton;
            this.btnClear = clearButton;
            this.modeToggle = modeToggleButton;
            this.chatManager = chatManager;
            this.wsClient = wsClient;
            this.config = configManager;
            this.autoMode = true;
            this.unifiedVoiceObserver = null;
            this.btnPlus = document.getElementById('btn-plus');
            this.panel = window._accessoryPanel;
            this.panelTabs = document.getElementById('panel-tabs');

            this.btnClear.setAttribute('aria-label', t('btn_clear_aria'));
            this.initEventListeners();
            this.updateSendButtonUI();
            this.updateModeToggleVisibility();
        }

        initEventListeners() {
            this.inputBox.addEventListener('input', () => {
                if (!this.wsClient.getConnected()) return;
                this.adjustHeight();
                this.wsClient.send('preview', this.inputBox.value);
                this.updateModeToggleVisibility();
                this.updatePlusSendVisibility();
            });

            // 跨平台统一语音特征检测
            this.unifiedVoiceObserver = new UnifiedVoiceInputObserver(this.inputBox, (text, reason) => {
                if (this.autoMode && this.wsClient.getConnected() && this.inputBox.value.trim() !== '') {
                    this.sendCurrentMessage(text);
                }
            });

            this.btnSend.addEventListener('click', (e) => {
                if (!this.wsClient.getConnected()) return;
                e.preventDefault();
                this.sendCurrentMessage();
                this.inputBox.focus();
            });

            this.btnPlus.addEventListener('click', (e) => {
                if (!this.wsClient.getConnected()) return;
                e.preventDefault();
                this.showAccessoryPanel();
            });

            this.inputBox.addEventListener('keydown', (e) => {
                if (!this.wsClient.getConnected()) return;
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    this.sendCurrentMessage();
                }
            });

            this.btnClear.addEventListener('click', () => {
                if (!this.wsClient.getConnected()) return;
                this.inputBox.value = '';
                this.adjustHeight();
                this.wsClient.send('preview', '');
                this.updateModeToggleVisibility();
                this.updatePlusSendVisibility();
                this.inputBox.focus();
            });
            this.btnClear.addEventListener('touchstart', (e) => { e.preventDefault(); this.btnClear.click(); });

            this.modeToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!this.wsClient.getConnected()) return;
                this.autoMode = !this.autoMode;
                this.updateSendButtonUI();
                if (navigator.vibrate) navigator.vibrate(30);
                this.updateModeToggleVisibility();
                this.inputBox.focus();
            });
            
            this.inputBox.addEventListener('focus', () => {
                this.hideAccessoryPanel();
                this.chatManager.scrollToBottom();
                setTimeout(() => this.chatManager.scrollToBottom(), 50);
                setTimeout(() => this.chatManager.scrollToBottom(), 150);
                setTimeout(() => this.chatManager.scrollToBottom(), 300);
            });

            // 连接状态走传输层的信号总线（不再是 document 上的 CustomEvent）：订阅拿到
            // 注销函数，且与 ack/config 等下行帧同一个入口，来源不再分两处
            this.wsClient.on(WS_STATUS, (st) => this.onConnectionChange(st.connected, st.message));
            this.setupScrollFix();
        }

        destroy() {
            if (this.unifiedVoiceObserver) {
                this.unifiedVoiceObserver.destroy();
                this.unifiedVoiceObserver = null;
            }
        }

        sendExternalMessage(text) {
            if (!text.trim()) return;
            this.wsClient.send('send', text);
            this.chatManager.addMessage(text);
        }
        sendCurrentMessage(text) {
            if (!text) text = this.inputBox.value;
            this.sendExternalMessage(text);
            this.inputBox.value = '';
            this.adjustHeight();
            this.wsClient.send('preview', '');
            this.updateModeToggleVisibility();
            this.updatePlusSendVisibility();
        }
        adjustHeight() {
            this.inputBox.style.height = 'auto';
            this.inputBox.style.height = this.inputBox.scrollHeight + 'px';
            this.chatManager.scrollToBottom();
        }
        updateSendButtonUI() {
            if (this.autoMode) {
                this.btnSend.textContent = t('btn_send_auto');
                document.body.classList.add('auto-mode');
                this.inputBox.placeholder = t('input_placeholder_auto');
            } else {
                this.btnSend.textContent = t('btn_send_manual');
                document.body.classList.remove('auto-mode');
                this.inputBox.placeholder = t('input_placeholder_manual');
            }
            this.updatePlusSendVisibility();
        }
        updateModeToggleVisibility() {
            if (!this.wsClient.getConnected()) {
                this.modeToggle.style.display = 'none';
                return;
            }
            this.modeToggle.style.display = (this.inputBox.value.trim() === '') ? 'block' : 'none';
        }
        updatePlusSendVisibility() {
            if (!this.wsClient.getConnected()) {
                this.btnPlus.style.display = 'none';
                this.btnSend.style.display = 'none';
                return;
            }
            const hasText = this.inputBox.value.trim() !== '';
            this.btnPlus.style.display = hasText ? 'none' : 'flex';
            this.btnSend.style.display = hasText ? 'flex' : 'none';
        }
        showAccessoryPanel() {
            if (this.panel.isVisible) {
                // 面板可见 → 收起面板（回到键盘输入）
                this.hideAccessoryPanel();
                this.inputBox.focus();
                return;
            }
            // 面板不可见 → 显示面板（收起键盘），并露出子面板切换条
            this.panel.show();
            this.panelTabs.classList.remove('hidden');
            this.inputBox.blur();
            if (window._adjustViewport) window._adjustViewport();
        }
        hideAccessoryPanel() {
            // 输入框获得焦点 → 面板与切换条一起隐藏
            this.panelTabs.classList.add('hidden');
            this.panel.hide();
        }
        onConnectionChange(connected, message, type) {
            const statusBar = document.getElementById('status-bar');
            const chatListDiv = document.getElementById('chat-list');
            if (connected) {
                statusBar.style.display = 'none';
                statusBar.classList.remove('loading');
                statusBar.classList.remove('debug');
                chatListDiv.classList.remove('offline');
                this.inputBox.disabled = false;
                this.btnSend.disabled = false;
                this.btnPlus.disabled = false;
                this.btnClear.disabled = false;
                this.modeToggle.disabled = false;
                this.updateSendButtonUI();
                this.updateModeToggleVisibility();
            } else {
                statusBar.style.display = 'block';
                statusBar.innerText = message || t('status_disconnected_text');
                statusBar.classList.toggle('loading', type === 'loading');
                statusBar.classList.remove('debug');
                chatListDiv.classList.add('offline');
                this.inputBox.disabled = true;
                this.btnSend.disabled = true;
                this.btnPlus.disabled = true;
                this.btnPlus.style.display = 'none';
                this.btnClear.disabled = true;
                this.modeToggle.disabled = true;
                this.modeToggle.style.display = 'none';
                this.inputBox.placeholder = t('input_placeholder_disconnected');
            }
        }
        setupScrollFix() {
            const resetViewport = () => {
                window.scrollTo(0, 0);
                this.chatManager.scrollToBottom();
            };
            this.inputBox.addEventListener('blur', resetViewport);
            document.addEventListener('focusout', (e) => {
                if (!this.inputBox.contains(e.relatedTarget)) {
                    resetViewport();
                }
            });
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) {
                    resetViewport();
                }
            });
            window.addEventListener('popstate', resetViewport);
        }
    }

    // ========== 6. 附件面板：子面板切换 + 鼠标摇杆 ==========

    /**
     * 子面板切换条（鼠标 / 键盘 / 文件）。
     *
     * 必须在 loadI18n() 之后调用：切换条的 aria-label 与各占位文案取自语言包，
     * 语言包未就绪时 t() 只会回退成键名。
     */
    function initPanelTabs() {
        const tabsEl = document.getElementById('panel-tabs');
        const tabButtons = tabsEl ? Array.prototype.slice.call(tabsEl.querySelectorAll('.tab')) : [];
        const views = Array.prototype.slice.call(document.querySelectorAll('#accessory-panel .panel-view'));

        function activatePanel(name) {
            tabButtons.forEach(function (b) {
                b.classList.toggle('active', b.dataset.panel === name);
            });
            views.forEach(function (v) {
                v.classList.toggle('active', v.id === 'view-' + name);
            });
        }
        window._activatePanel = activatePanel; // 供调试与后续对接使用

        tabButtons.forEach(function (b) {
            b.setAttribute('aria-label', t('panel_tab_' + b.dataset.panel));
            b.addEventListener('click', function (e) {
                e.preventDefault();
                activatePanel(this.dataset.panel);
                if (navigator.vibrate) navigator.vibrate(15);
            });
        });

        // 所有带 data-i18n 的占位文案统一回填（鼠标面板的提示由 MouseJoystick 自管）
        document.querySelectorAll('#accessory-panel [data-i18n]').forEach(function (el) {
            el.textContent = t(el.dataset.i18n);
        });
    }

    /**
     * 摇杆子面板：王者荣耀式虚拟摇杆（速度模型）+ 4×4 动作按钮网格。
     *
     * 对应 docs/mouse-joystick-design.md：
     *   - §3.1 方案 A：CSS 由类自带（static get STYLES），选择器挂 .mouse-joystick，零全局污染
     *   - §3.2 解耦原则：不碰 WebSocket，所有输出只走 onCommand(frame) 一个出口
     *   - §4 布局：调参行 / 读数行 / 摇杆 + 按钮网格 / 提示行
     *   - §5.1 帧格式严格对齐 wire-protocol.md §7 的 mouse / key，不发明协议外字段
     */
    class MouseJoystick {
        // 一次性动作按钮（4×4 网格，数组顺序即 DOM 顺序）
        // frame 是完整帧对象（含 type）：鼠标类落 type:"mouse"，按键类落 type:"key"
        static get ACTIONS() {
            return [
                { id: 'left',       i18n: 'panel_btn_left',       frame: { type: 'mouse', a: 'click', btn: 'left' } },
                { id: 'right',      i18n: 'panel_btn_right',      frame: { type: 'mouse', a: 'click', btn: 'right' } },
                { id: 'del',        text: '⌫',     repeat: true, frame: { type: 'key', keys: 'backspace' } },
                { id: 'enter',      text: 'Enter', cls: 'pv-enter', frame: { type: 'key', keys: 'enter' } },
                { id: 'double',     i18n: 'panel_btn_double',     frame: { type: 'mouse', a: 'double', btn: 'left' } },
                { id: 'drag',       i18n: 'panel_btn_drag', toggle: true },
                { id: 'esc',        text: 'Esc',                  frame: { type: 'key', keys: 'esc' } },
                { id: 'shiftenter', text: '⇧Enter', cls: 'pv-enter', title: 'Shift+Enter', frame: { type: 'key', keys: 'shift+enter' } },
                { id: 'wheelup',    i18n: 'panel_btn_wheel_up',   cls: 'pv-narrow', repeat: true, frame: { type: 'mouse', a: 'wheel', delta: -120 } },
                { id: 'redo',       text: 'Ctrl+Y', cls: 'pv-narrow', frame: { type: 'key', keys: 'ctrl+y' } },
                { id: 'up',         text: '↑',      repeat: true, frame: { type: 'key', keys: 'up' } },
                { id: 'undo',       text: 'Ctrl+Z', cls: 'pv-narrow', frame: { type: 'key', keys: 'ctrl+z' } },
                { id: 'wheeldown',  i18n: 'panel_btn_wheel_down', cls: 'pv-narrow', repeat: true, frame: { type: 'mouse', a: 'wheel', delta: 120 } },
                { id: 'arrleft',    text: '←',      repeat: true, frame: { type: 'key', keys: 'left' } },
                { id: 'arrdown',    text: '↓',      repeat: true, frame: { type: 'key', keys: 'down' } },
                { id: 'arrright',   text: '→',      repeat: true, frame: { type: 'key', keys: 'right' } }
            ];
        }

        static get STYLES() {
            return `
        .mouse-joystick {
            display: flex;

        .mouse-joystick .pv-tuning {

        .mouse-joystick .pv-grid button[data-id="left"],

        .mouse-joystick .pv-grid button[data-id="arrleft"],
        .mouse-joystick .pv-grid button[data-id="arrdown"],

        .mouse-joystick .pv-grid button[data-id="wheeldown"] {
            background: rgba(245, 158, 11, 0.14);

            color: #b45309;
        }
        .mouse-joystick .pv-grid button[data-id="undo"],
        .mouse-joystick .pv-grid button[data-id="redo"] {
            background: rgba(139, 92, 246, 0.12);
            border-color: rgba(139, 92, 246, 0.45);
            color: #7c3aed;
        }
        .mouse-joystick .pv-grid button:active {
            background-image: linear-gradient(rgba(0, 0, 0, 0.07), rgba(0, 0, 0, 0.07));
        }
        .mouse-joystick .pv-grid button.pv-enter {
            border-color: #07c160;
            color: #07c160;
            font-weight: 600;
        }
        .mouse-joystick .pv-stick {
            flex: 2 2 0;
            min-width: 104px;
            align-self: stretch;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mouse-joystick .pv-stick-base {
            position: relative;
            width: 112px;
            height: 112px;
            border-radius: 50%;
            background: #ffffff;
            border: 1.5px solid #dcdcdc;
            box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.04), 0 2px 8px rgba(0, 0, 0, 0.06);
            touch-action: none;
            flex-shrink: 0;
        }
        .mouse-joystick .pv-cross-h,
        .mouse-joystick .pv-cross-v {
            position: absolute;
            background: #f0f0f0;
        }
        .mouse-joystick .pv-cross-h {
            left: 14%;
            right: 14%;
            top: 50%;
            height: 1px;
            transform: translateY(-50%);
        }
        .mouse-joystick .pv-cross-v {
            top: 14%;
            bottom: 14%;
            left: 50%;
            width: 1px;
            transform: translateX(-50%);
        }
        .mouse-joystick .pv-knob {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 34%;
            height: 34%;
            margin: -17%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #7bd8c6, #07c160);
            border: 2px solid rgba(7, 193, 96, 0.6);
            box-shadow: 0 0 16px rgba(7, 193, 96, 0.35);
        }
            `;
        }

        constructor(root, options = {}) {
            this.root = root;
            this.onCommand = options.onCommand || function () {};
            this.maxSpeed = options.maxSpeed || 1500;   // px/s 满推速度
            this.deadzone = options.deadzone || 0.12;   // 死区比例

            this.active = false;
            this.dirX = 0;      // 单位方向向量
            this.dirY = 0;
            this.mag = 0;       // 幅度 0~1
            this.dragOn = false;
            this._accX = 0;     // 位移小数余量，跨帧累加避免截断误差
            this._accY = 0;
            this._lastT = 0;
            this._rafId = null;
            this._ro = null;
            this._wheelDelay = null;
            this._wheelTimer = null;

            this._boundLoop = this._loop.bind(this);
            this._boundResize = this._fitStick.bind(this);

            this._injectStyles();
            // 与 TouchpadPanel 同一约定：面板类加在 section 内的独立根容器上，
            // 不污染 section，避免 .mouse-joystick 之类规则干扰 .panel-view 的显隐。
            this.root.innerHTML = '<div class="mouse-joystick"></div>';
            this.root = this.root.querySelector('.mouse-joystick');
            this._buildDOM();
            this._bindPointer();
            this._rafId = requestAnimationFrame(this._boundLoop);
        }

        // ---------- 构建 ----------

        _injectStyles() {
            if (document.getElementById('mouse-joystick-styles')) return;   // 幂等
            const style = document.createElement('style');
            style.id = 'mouse-joystick-styles';
            style.textContent = MouseJoystick.STYLES;
            document.head.appendChild(style);
        }

        _buildDOM() {
            const gridHtml = MouseJoystick.ACTIONS.map(function (act, i) {
                const cls = ['pv-act', act.cls || ''].join(' ').trim();
                const title = act.title ? ' title="' + act.title + '"' : '';
                const label = act.i18n
                    ? '<span data-i18n="' + act.i18n + '"></span>'
                    : act.text;
                return '<button type="button" class="' + cls + '"' + title +
                       ' data-act="' + i + '" data-id="' + act.id + '">' + label + '</button>';
            }).join('');

            this.root.innerHTML = [
                '<div class="pv-tuning">',
                '  <div class="pv-tune">',
                '    <label for="mj-speed" data-i18n="panel_tune_speed"></label>',
                '    <input id="mj-speed" class="pv-speed-range" type="range" min="200" max="3000" step="50">',
                '    <span class="val pv-speed-val"></span>',
                '  </div>',
                '  <div class="pv-tune">',
                '    <label for="mj-dead" data-i18n="panel_tune_dead"></label>',
                '    <input id="mj-dead" class="pv-dead-range" type="range" min="0" max="30">',
                '    <span class="val pv-dead-val"></span>',
                '  </div>',
                '</div>',
                '<div class="pv-readout">',
                '  <span class="pv-readout-label" data-i18n="panel_mag"></span>',
                '  <div class="pv-mag"><div class="pv-mag-fill"></div></div>',
                '  <span class="pv-speed">0 px/s</span>',
                '</div>',
                '<div class="pv-control">',
                '  <div class="pv-stick">',
                '    <div class="pv-stick-base">',
                '      <span class="pv-cross-h"></span><span class="pv-cross-v"></span>',
                '      <div class="pv-knob"></div>',
                '    </div>',
                '  </div>',
                '  <div class="pv-grid">' + gridHtml + '</div>',
                '</div>',
                '<div class="pv-hint" data-i18n="panel_hint_mouse"></div>'
            ].join('');

            // 语言包已由 loadI18n() 就绪，统一回填 data-i18n 文案
            this.root.querySelectorAll('[data-i18n]').forEach(function (el) {
                el.textContent = t(el.dataset.i18n);
            });

            this.base = this.root.querySelector('.pv-stick-base');
            this.knob = this.root.querySelector('.pv-knob');
            this.magFill = this.root.querySelector('.pv-mag-fill');
            this.speedEl = this.root.querySelector('.pv-speed');
            this.dragBtn = this.root.querySelector('[data-id="drag"]');

            this._initTuning();
            this._bindActions();

            // 自适应尺寸：面板由隐藏切为可见时 ResizeObserver 会补一次测量
            if (typeof ResizeObserver !== 'undefined') {
                this._ro = new ResizeObserver(this._boundResize);
                this._ro.observe(this.base.parentElement);
            }
            window.addEventListener('resize', this._boundResize);
            this._fitStick();
        }

        _initTuning() {
            const speedRange = this.root.querySelector('.pv-speed-range');
            const speedVal = this.root.querySelector('.pv-speed-val');
            const deadRange = this.root.querySelector('.pv-dead-range');
            const deadVal = this.root.querySelector('.pv-dead-val');

            speedRange.value = this.maxSpeed;
            speedVal.textContent = this.maxSpeed;
            speedRange.addEventListener('input', () => {
                this.maxSpeed = +speedRange.value;
                speedVal.textContent = this.maxSpeed;
            });

            deadRange.value = Math.round(this.deadzone * 100);
            deadVal.textContent = this.deadzone.toFixed(2);
            deadRange.addEventListener('input', () => {
                this.deadzone = +deadRange.value / 100;
                deadVal.textContent = this.deadzone.toFixed(2);
            });
        }

        // ---------- 输出（唯一出口） ----------

        // dx / dy 是每帧小数位移。沿方向取整（而非按轴独立截断）：pyautogui 只收
        // 整数像素，按轴截断会让慢速 45° 方向某帧只走 x、某帧只走 y，方向漂成纯
        // 水平/纯垂直。沿方向取整保证每帧输出向量方向与累加方向一致、模长精确。
        _emitMove(dx, dy) {
            this._accX += dx;
            this._accY += dy;
            const mag = Math.hypot(this._accX, this._accY);
            if (mag < 1) return;                      // 不足 1px，留到下一帧
            const n = Math.floor(mag);
            const ox = Math.round(this._accX / mag * n);
            const oy = Math.round(this._accY / mag * n);
            this._accX -= ox;                          // 向量减法，方向与模长都守恒
            this._accY -= oy;
            if (ox === 0 && oy === 0) return;
            this.onCommand({ type: 'mouse', a: 'move', dx: ox, dy: oy });
        }

        _emitAction(frame) {
            this.onCommand(frame);
        }

        _setDrag(on) {
            this.dragOn = on;
            if (this.dragBtn) this.dragBtn.classList.toggle('on', on);
            this._emitAction({ type: 'mouse', a: on ? 'down' : 'up', btn: 'left' });
        }

        // ---------- 交互 ----------

        _bindPointer() {
            const base = this.base;
            base.addEventListener('pointerdown', (e) => {
                this.active = true;
                try { base.setPointerCapture(e.pointerId); } catch (err) {}
                this._updateStick(e.clientX, e.clientY);
                this._lastT = performance.now();
                e.preventDefault();
            });
            base.addEventListener('pointermove', (e) => {
                if (!this.active) return;
                this._updateStick(e.clientX, e.clientY);
                e.preventDefault();
            });
            base.addEventListener('pointerup', () => this._endStick());
            base.addEventListener('pointercancel', () => this._endStick());
        }

        _updateStick(clientX, clientY) {
            const rect = this.base.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            let dx = clientX - cx;
            let dy = clientY - cy;
            const dist = Math.hypot(dx, dy);
            const maxR = Math.max(8, (rect.width - this.knob.offsetWidth) / 2);
            if (dist > maxR) {
                // 位置 clamp 到圆边，但方向向量直接用 clamp 后的 dx/dy 除以 maxR，
                // 因此 dirX/dirY 始终是“单位方向”，与手指推出多远无关（sample 算法）。
                dx = dx / dist * maxR;
                dy = dy / dist * maxR;
            }
            this.mag = Math.min(1, dist / maxR);
            this.dirX = dist > 0 ? dx / maxR : 0;
            this.dirY = dist > 0 ? dy / maxR : 0;
            this.knob.style.transition = 'none';
            this.knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
        }

        _endStick() {
            if (!this.active) return;
            this.active = false;
            this.dirX = this.dirY = 0;
            this.mag = 0;
            this._accX = this._accY = 0;
            this.knob.style.transition = 'transform 0.18s ease-out';
            this.knob.style.transform = 'translate(0,0)';
        }

        _bindActions() {
            const self = this;
            this.root.querySelectorAll('.pv-act').forEach(function (el) {
                const act = MouseJoystick.ACTIONS[+el.dataset.act];
                el.addEventListener('pointerdown', function (e) {
                    e.preventDefault();
                    if (navigator.vibrate) navigator.vibrate(10);
                    if (act.toggle) {
                        self._setDrag(!self.dragOn);
                        return;
                    }
                    self._emitAction(act.frame);
                    if (act.repeat) self._startRepeat(act.frame);
                });
                if (act.repeat) {
                    el.addEventListener('pointerup', () => self._stopRepeat());
                    el.addEventListener('pointercancel', () => self._stopRepeat());
                    el.addEventListener('pointerleave', () => self._stopRepeat());
                }
            });
        }

        // 滚轮长按连发：首次立即发，延迟 350ms 后每 50ms 一格
        _startRepeat(frame) {
            this._stopRepeat();
            this._wheelDelay = setTimeout(() => {
                this._wheelTimer = setInterval(() => this._emitAction(frame), 50);
            }, 350);
        }

        _stopRepeat() {
            if (this._wheelDelay) { clearTimeout(this._wheelDelay); this._wheelDelay = null; }
            if (this._wheelTimer) { clearInterval(this._wheelTimer); this._wheelTimer = null; }
        }

        // ---------- 帧循环 ----------

        _loop(now) {
            const dt = Math.min(50, now - this._lastT) / 1000;   // 上限 50ms，防切后台回来跳变
            this._lastT = now;

            let speed = 0;
            if (this.active && this.mag > this.deadzone) {
                // 与 sample 一致：线性曲线。dirX/dirY 已是“单位方向 × 幅度”，
                // eff 做死区归一化后线性映射到 maxSpeed，方向变化线性可感、满推行程恒定。
                const eff = Math.min(1, (this.mag - this.deadzone) / (1 - this.deadzone));
                speed = eff * this.maxSpeed;
                this._emitMove(this.dirX * speed * dt, this.dirY * speed * dt);
            }
            this._updateReadout(speed);
            this._rafId = requestAnimationFrame(this._boundLoop);
        }

        _updateReadout(speed) {
            this.magFill.style.width = (this.mag * 100).toFixed(1) + '%';
            this.speedEl.textContent = Math.round(speed) + ' px/s';
        }

        // 摇杆底座尽量大：占满 .pv-stick 可用区域并保持圆形
        _fitStick() {
            const stick = this.base.parentElement;
            if (!stick) return;
            const w = stick.clientWidth;
            const h = stick.clientHeight;
            if (w < 20 || h < 20) return;   // 面板收起 / 未激活时跳过
            const s = Math.max(88, Math.min(w, h) - 8);
            this.base.style.width = s + 'px';
            this.base.style.height = s + 'px';
        }

        // ---------- 生命周期 ----------

        start() {
            if (this._rafId === null) {
                this._lastT = performance.now();
                this._rafId = requestAnimationFrame(this._boundLoop);
            }
        }

        destroy() {
            if (this._rafId !== null) { cancelAnimationFrame(this._rafId); this._rafId = null; }
            this._stopRepeat();
            if (this._ro) { this._ro.disconnect(); this._ro = null; }
            window.removeEventListener('resize', this._boundResize);
            if (this.root && this.root.parentNode) this.root.parentNode.removeChild(this.root);
        }
    }

    /**
     * 鼠标子面板：触控板模式（矩形触摸板）。
     *
     * 触摸逻辑移植自 docs/touchpad-sample.html：
     *   - 单指拖拽 → move 帧（dx/dy = 手指位移 × 速度倍率）
     *   - 轻点（位移 < 10px 且 < 300ms）→ 左键单击
     *   - 双指上下拖 → 滚轮帧（每累计 6px 一个刻度，上 = -120 / 下 = +120）
     * 自带按钮列（左/右/双击/拖拽 + Enter/Shift+Enter/Undo/Redo），不复用摇杆的动作网格。
     * 输出只走 onCommand(frame) 一个出口，不碰 WebSocket（与 MouseJoystick 同约定）。
     */
    class TouchpadPanel {
        static get STYLES() {
            return `
        .touchpad-panel {
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
        }
        .touchpad-panel .tp-speed-bar {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 2px 8px 6px;
            border-bottom: 1px solid var(--border-color, #3a3a42);
            margin-bottom: 4px;
        }
        .touchpad-panel .tp-speed-bar label {
            font-size: 11px;
            color: #9aa;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .touchpad-panel .tp-speed-bar input[type="range"] {
            flex: 1;
            min-width: 60px;
            height: 3px;
            accent-color: #07c160;
            cursor: pointer;

        constructor(root, options = {}) {
            this.root = root;
            this.onCommand = options.onCommand || function () {};
            this.speed = options.speed || 7.5;        // 触控板灵敏度倍率（手指位移 × speed）
            this.dragOn = false;
            this._accX = 0;
            this._accY = 0;
            this._ts = {
                active: false, fingerCount: 0, startTime: 0,
                startX: 0, startY: 0, lastX: 0, lastY: 0,
                maxDist: 0, twoFingerPrevY: 0, scrollAccum: 0,
                speedSmooth: 0, lastMoveTime: 0
            };
            this._scrollHideTimer = null;
            this._spdTimer = null;

            // 否则 .touchpad-panel{display:flex} 会盖过 .panel-view 的显隐控制，导致切面板时触控板无法隐藏。
            this.root.innerHTML = '<div class="touchpad-panel"></div>';

            style.id = 'touchpad-panel-styles';
            style.textContent = TouchpadPanel.STYLES;
            document.head.appendChild(style);
        }

        _buildDOM() {
            this.root.innerHTML = [
                '<div class="tp-speed-bar">',
                '  <label>🐢 速度</label>',
                '  <input id="tp-speed" type="range" min="1" max="20" step="0.5" value="5">',
                '  <span class="tp-speed-val">1.00</span>',
                '</div>',
                '<div class="tp-main-row">',
                '  <div class="tp-btn-col">',
                '    <button type="button" data-act="left">左键</button>',
                '    <button type="button" data-act="right">右键</button>',
                '    <button type="button" data-act="double">双击</button>',
                '    <button type="button" data-act="drag">拖拽</button>',
                '  </div>',
                '  <div class="tp-touchpad-wrap">',
                '    <div class="tp-touchpad">',
                '      <div class="tp-grid-h"></div>',
                '      <div class="tp-grid-v"></div>',
                '      <div class="tp-icon">✚</div>',
                '      <div class="tp-hud">',
                '        <div class="tp-spd">速度 <span class="val tp-spd-val">0</span> px/s</div>',
                '        <div class="tp-fingers">手指 <span class="val tp-fingers-val">0</span></div>',
                '      </div>',
                '      <div class="tp-scroll-ind">',
                '        <div class="arrow up">▲</div>',
                '        <div class="line"></div>',
                '        <div class="arrow down">▼</div>',
                '      </div>',
                '      <div class="tp-finger"></div>',
                '      <div class="tp-hint">滑动 · 轻点 · 双指滚动</div>',
                '    </div>',
                '  </div>',
                '  <div class="tp-btn-col-right">',
                '    <button type="button" data-act="enter" class="enter-btn">↵ Enter</button>',
                '    <button type="button" data-act="shiftenter" class="shift-enter-btn">⇧ Enter</button>',
                '    <button type="button" data-act="undo" class="undo-btn">↩ Undo</button>',
                '    <button type="button" data-act="redo" class="redo-btn">↪ Redo</button>',
                '  </div>',

            this.finger = this.root.querySelector('.tp-finger');
            this.speedRange = this.root.querySelector('#tp-speed');

            this.scrollUp = this.root.querySelector('.tp-scroll-ind .arrow.up');

            // 速度倍率滑块（触控板手感：默认 5.0，最高 20）

        // ---------- 输出（唯一出口） ----------

        static get FRAMES() {
            return {
                left:       { type: 'mouse', a: 'click', btn: 'left' },
                right:      { type: 'mouse', a: 'click', btn: 'right' },
                double:     { type: 'mouse', a: 'double', btn: 'left' },
                enter:      { type: 'key', keys: 'enter' },
                shiftenter: { type: 'key', keys: 'shift+enter' },
                undo:       { type: 'key', keys: 'ctrl+z' },
                redo:       { type: 'key', keys: 'ctrl+y' }
            };
        }

        // 位移小数余量跨帧累加，沿方向取整发整数像素（与 MouseJoystick 同策略）
        _emitMove(dx, dy) {
            this._accX += dx;
            this._accY += dy;
            const mag = Math.hypot(this._accX, this._accY);
            if (mag < 1) return;
            const n = Math.floor(mag);
            const ox = Math.round(this._accX / mag * n);
            const oy = Math.round(this._accY / mag * n);
            this._accX -= ox;
            this._accY -= oy;
            if (ox === 0 && oy === 0) return;
            this._emitAction({ type: 'mouse', a: 'move', dx: ox, dy: oy });
        }

        _emitAction(frame) {
            this.onCommand(frame);
        }

        // ---------- 按钮 ----------

        _bindButtons() {
            const self = this;
            this.root.querySelectorAll('.tp-btn-col button, .tp-btn-col-right button').forEach(function (el) {
                const act = el.dataset.act;
                el.addEventListener('pointerdown', function (e) {
                    e.preventDefault();
                    if (navigator.vibrate) navigator.vibrate(10);
                    if (act === 'drag') {
                        self._toggleDrag(el);
                        return;
                    }
                    const frame = TouchpadPanel.FRAMES[act];
                    if (frame) self._emitAction(frame);
                    self._spawnRipple('');
                    self._showKeyFeedback(el.textContent.trim());
                });
            });
        }

        _toggleDrag(el) {
            this.dragOn = !this.dragOn;
            el.classList.toggle('on', this.dragOn);
            this._emitAction({ type: 'mouse', a: this.dragOn ? 'down' : 'up', btn: 'left' });
            this._showKeyFeedback(this.dragOn ? '拖拽 ON' : '拖拽 OFF');

        // ---------- 触摸核心 ----------

        _center(touches) {
            let cx = 0, cy = 0;
            for (let i = 0; i < touches.length; i++) {
                cx += touches[i].clientX;
                cy += touches[i].clientY;
            }
            return { x: cx / touches.length, y: cy / touches.length };
        }

        _bindTouch() {
            const tp = this.touchpad;
            const self = this;
            const ts = self._ts;

            tp.addEventListener('touchstart', function (e) {
                e.preventDefault();
                const touches = e.touches;
                const count = touches.length;
                ts.active = true;
                ts.fingerCount = count;
                ts.maxDist = 0;
                ts.startTime = performance.now();
                ts.lastMoveTime = ts.startTime;
                const center = self._center(touches);
                ts.startX = ts.lastX = center.x;
                ts.startY = ts.lastY = center.y;
                if (count === 1) {
                    ts.twoFingerPrevY = 0;
                    ts.scrollAccum = 0;
                    self._showFinger(touches[0].clientX, touches[0].clientY, 1);
                    tp.classList.add('active');
                } else if (count >= 2) {
                    ts.twoFingerPrevY = center.y;
                    ts.scrollAccum = 0;
                    self._showFinger(center.x, center.y, 2);
                    tp.classList.add('active');
                }
            }, { passive: false });

            tp.addEventListener('touchmove', function (e) {
                e.preventDefault();
                const touches = e.touches;
                const count = touches.length;
                if (!ts.active || count === 0) return;
                const center = self._center(touches);
                if (count === 1) {
                    const dx = center.x - ts.lastX;
                    const dy = center.y - ts.lastY;
                    ts.maxDist = Math.max(ts.maxDist, Math.hypot(center.x - ts.startX, center.y - ts.startY));
                    self._emitMove(dx * self.speed, dy * self.speed);
                    self._updateSpeed(dx * self.speed, dy * self.speed);
                    self._showFinger(touches[0].clientX, touches[0].clientY, 1);
                    tp.classList.add('active');
                    ts.lastX = center.x;
                    ts.lastY = center.y;
                } else if (count >= 2) {
                    // 双指上下拖 → 滚轮（与 MouseJoystick 的 wheelup=-120 / wheeldown=+120 对齐）
                    const deltaY = center.y - ts.twoFingerPrevY;
                    const sens = 0.8;
                    ts.scrollAccum += -deltaY * sens * 0.5;
                    const threshold = 6;
                    if (Math.abs(ts.scrollAccum) >= threshold) {
                        const steps = Math.floor(ts.scrollAccum / threshold);
                        const up = steps > 0;
                        self._emitAction({ type: 'mouse', a: 'wheel', delta: up ? -120 : 120 });
                        self._spawnRipple(up ? 'scroll-up' : 'scroll-down');
                        self._showScroll(up);
                        ts.scrollAccum -= steps * threshold;
                    }
                    ts.twoFingerPrevY = center.y;
                    self._showFinger(center.x, center.y, 2);
                    tp.classList.add('active');
                }

                const count = touches.length;
                if (count === 0) {

                        self._emitAction({ type: 'mouse', a: 'click', btn: 'left' });
                        self._spawnRipple('');
                    }
                    ts.active = false;
                    ts.fingerCount = 0;
                    ts.maxDist = 0;
                    ts.scrollAccum = 0;
                    tp.classList.remove('active');
                    self._hideFinger();
                    self._clearSpeedLater();
                } else {
                    ts.fingerCount = count;
                    const center = self._center(touches);
                    if (count === 1) {
                        ts.lastX = center.x;
                        ts.lastY = center.y;
                        self._showFinger(touches[0].clientX, touches[0].clientY, 1);
                    } else if (count >= 2) {
                        ts.twoFingerPrevY = center.y;
                        self._showFinger(center.x, center.y, 2);
                    }
                }
            }, { passive: false });

            tp.addEventListener('touchcancel', function (e) {
                e.preventDefault();
                ts.active = false;
                ts.fingerCount = 0;
                ts.maxDist = 0;
                ts.scrollAccum = 0;
                tp.classList.remove('active');
                self._hideFinger();
                self._clearSpeed();
            }, { passive: false });

        _showFinger(clientX, clientY, count) {

            let dy = (clientY - cy) / (h / 2);
            if (Math.abs(dx) > 1) dx = Math.sign(dx);
            if (Math.abs(dy) > 1) dy = Math.sign(dy);

            const py = cy + dy * (h / 2) * 0.85 - rect.top;

            this.finger.style.top = py + 'px';
            this.finger.classList.add('show');
            if (count >= 2) this.finger.classList.add('two');
            else this.finger.classList.remove('two');
            this.fingersVal.textContent = count;
        }

        _hideFinger() {
            this.finger.classList.remove('show', 'two');
            this.fingersVal.textContent = '0';
        }

        _spawnRipple(cls) {

            rip.className = 'tp-ripple' + (cls ? ' ' + cls : '');

            rip.style.top = '50%';

            setTimeout(function () {

        _updateSpeed(mx, my) {

            clearTimeout(this._spdTimer);
