            border-radius: 12px 4px 12px 12px;

            white-space: pre-wrap;

            font-size: 16px;
            line-height: 1.5;
            user-select: none;
            -webkit-touch-callout: none;
            transition: filter 0.2s, opacity 0.2s;
        }

        }
        .offline .message {

            filter: grayscale(0.5);
        }
        #bottom-bar {

            padding: 10px 12px;

            align-items: flex-end;
            gap: 10px;

        .input-wrapper {

            position: relative;
        }
        #input-box {

            font-size: 16px;
            line-height: 20px;
            border: none;
            border-radius: 8px;
            background-color: #ffffff;
            color: #333;
            resize: none;

            border: none;
            font-size: 20px;
            padding: 4px 6px;
            border-radius: 20px;

    </style>

<script>
    // ========== 0. 国际化：语言包由 PC 端通过 /api/lang.json 提供 ==========
    // 相对路径请求，自动适配加密模式的 /{secret}/ 前缀
    window.i18n = {};

    async function loadI18n() {
        try {
            const res = await fetch('api/lang.json');
            if (res.ok) {
                window.i18n = await res.json();
            } else {
                console.warn('i18n load failed, using fallback keys.');
            }
        } catch (e) {
            console.warn('Network error loading i18n, using fallback keys.', e);
        }
    }

    // 翻译函数：缺失时回退为键名（带参数时附带参数），便于定位未翻译项
    function t(key, params) {
        const text = window.i18n?.[key];
        if (text === undefined || text === null) {
            if (!params) return key;
            const paramStr = Object.entries(params).map(([k, v]) => `${k}=${v}`).join(', ');
            return `${key}(${paramStr})`;
        }
        if (params) {
            return text.replace(/\{(\w+)\}/g, (match, p1) => {
                const val = params[p1];
                return val !== undefined ? String(val) : match;
            });
        }
        return text;
    }
</script>

<script>

    // ========== 0.5 键盘附件面板状态机 ==========
    /**
     * 键盘附件面板控制器：用状态机管理面板的显示/隐藏，
     * 内置超时兜底和竞态保护，避免因 resize 事件不可靠导致状态卡死。
     *
     * 状态：
     *   hidden  — 面板完全隐藏（高度为 0）
     *   visible — 面板可见（高度 = 缓存键盘高度 - 当前键盘高度）
     *   hiding  — 面板正在隐藏中（等待键盘弹出把面板"挤没"，带超时兜底）
     *
     * 外部通过 update(kh) 传入当前键盘高度，状态机自行计算面板高度和状态转换。
     */
    class KeyboardAccessoryPanel {
        constructor(element, options = {}) {
            this.el = element;
            this.state = 'hidden';       // hidden | visible | hiding
            this._kh = 0;                // 当前键盘高度
            this._cached = options.defaultHeight || 300;
            this._maxVH = 0;             // 历史最大视口高度，用于推算键盘高度
            this._hideTimeoutMs = options.hideTimeout || 500;
            this._hideTimer = null;
        }

        setCachedHeight(h) {
            this._cached = h;
        }

        get isVisible() {
            return this.state === 'visible';
        }

        get isHiding() {
            return this.state === 'hiding';
        }

        /**
         * 显示面板：立即进入 visible 状态，根据当前键盘高度设置面板高度。
         * 竞态保护：清掉上一次 hiding 的定时器。
         */
        show() {
            if (this.state === 'visible') return;
            this._clearTimers();
            this.state = 'visible';
            this._applyHeight();
        }

        /**
         * 隐藏面板：进入 hiding 状态，等待键盘弹出把面板高度挤到 0。
         * 如果 resize 事件不可靠导致迟迟收不到尾帧，超时后强制收尾。
         */
        hide() {
            if (this.state === 'hidden') return;
            this._clearTimers();
            this.state = 'hiding';
            // 超时兜底：防止 resize 事件不完整导致状态卡死
            this._hideTimer = setTimeout(() => {
                if (this.state === 'hiding') {
                    this.state = 'hidden';
                    this.el.style.height = '0';
                }
            }, this._hideTimeoutMs);
        }

        /**
         * 切换：显示 ↔ 隐藏。
         * 注意：切换判断基于面板自身状态，不依赖输入框焦点。
         * 如果外部想以输入框焦点为判断依据，自己在外面判断再调用 show/hide。
         */
        toggle() {

                this.show();

                this.hide();
            }
        }

        /**
         * 每帧更新：传入当前键盘高度，状态机自行计算面板高度和状态转换。
         * 由外部的 resize 事件驱动调用。
         */
        update(keyboardHeight) {
            this._kh = keyboardHeight;
            if (this.state === 'visible') {
                this._applyHeight();
            } else if (this.state === 'hiding') {
                this._applyHeight();
                // 自然收尾：面板被键盘挤没了，进入终态
                const ph = Math.max(0, this._cached - keyboardHeight);
                if (ph < 5) {
                    this._clearTimers();
                    this.state = 'hidden';
                    this.el.style.height = '0';
                }
            }
        }

        /**
         * 视口变化时由外部调用：传入当前 visualViewport 高度，
         * 自行推算键盘高度、维护缓存（面板不可见时刷新）、驱动状态机。
         * 把"键盘高度推算 + 缓存维护 + 面板高度更新"收敛到面板内部，
         * 调用方只需负责容器高度与滚动，不再感知键盘高度细节。
         */
        syncViewport(height) {
            if (height > this._maxVH) this._maxVH = height;
            const keyboardHeight = this._maxVH - height;
            if (keyboardHeight > 10 && this.state !== 'visible') {
                this._cached = keyboardHeight;
            }
            this.update(keyboardHeight);
        }

        _applyHeight() {
            const ph = Math.max(0, this._cached - this._kh);
            this.el.style.height = ph + 'px';
        }

        _clearTimers() {
            if (this._hideTimer) {
                clearTimeout(this._hideTimer);
                this._hideTimer = null;
            }
        }
    }

    // ========== 1.1 豆包 iOS 语音输入严密特征检测器 (带逻辑归零机制) ==========
    const FSM = {
        IDLE: 'IDLE',
        DELETING: 'DELETING',
        WAIT_ZERO: 'WAIT_ZERO',
        INJECTING: 'INJECTING',
        SILENT_VERIFYING: 'SILENT_VERIFYING'
    };

    class DoubaoVoiceObserver {
        static get EVENT_COMPLETE() {
            return 'doubao:voice:complete';
        }

        constructor(element, options = {}) {
            this.element = element;
            
            // 兼容之前直接传 debug 布尔值的初始化方式
            if (typeof options === 'boolean') {
                options = { debug: options };
            }
            
            this.debug = options.debug || false;
            
            // 允许忽略的残余首字符参数
            const prefixStr = options.ignorePrefixChars !== undefined ? options.ignorePrefixChars : "。. ";
            this.ignorePrefixChars = Array.from(prefixStr);

            // 【新增】退格触发时的 gap 区间匹配（默认 0 禁用）
            // 仅当 gap 落在 [min, max] 毫秒区间内时，才判定为豆包内部修正并忽略退格
            const gapCfg = options.keyupDeleteGap || {};
            this.keyupDeleteGapMin = gapCfg.min || 0;
            this.keyupDeleteGapMax = gapCfg.max || 0;
            // 记录最近一次单字符输入的时间戳（仅在 IDLE 状态更新）
            this.lastKeyupTime = 0;

            this.state = FSM.IDLE;
            this.expectedText = "";
            this.timer = null;

            this._handleEvent = this._handleEvent.bind(this);
            this.init();
        }

        init() {
            const events = ['keydown', 'keyup', 'beforeinput', 'input', 'blur', 'focus'];
            events.forEach(ev => this.element.addEventListener(ev, this._handleEvent));
            document.addEventListener('selectionchange', this._handleEvent);
        }

        destroy() {
            const events = ['keydown', 'keyup', 'beforeinput', 'input', 'blur', 'focus'];
            events.forEach(ev => this.element.removeEventListener(ev, this._handleEvent));
            document.removeEventListener('selectionchange', this._handleEvent);
            this._reset();
        }

        _log(msg, ...args) {
            if (this.debug) console.log(`[DoubaoFSM | ${this.state}] ${msg}`, ...args);
        }

        _reset() {
            if (this.state !== FSM.IDLE) {
                this.state = FSM.IDLE;
                this.expectedText = "";
                if (this.timer) {
                    clearTimeout(this.timer);
                    this.timer = null;
                }
            }
        }

        _isControlKey(key) {
            return ['Backspace', 'Enter', 'Tab', 'Escape', 'Shift', 'Control', 'Alt', 'Meta'].includes(key);
        }

        /**
         * 【核心新增】判断输入框是否“逻辑归零”
         * 严格限定：只有在彻底为空，或只剩下 1 个被允许忽略的字符时，才视为归零。
         */
        _isLogicalZero(text) {
            if (text.length === 0) return true;
            if (text.length === 1 && this.ignorePrefixChars.includes(text)) return true;
            return false;
        }

        /**
         * 【修改】归一化文本：除了处理换行，如果首字符是残余标点，一并静默剥离
         */
        _normalizeText(text) {
            let processed = text;
            if (processed.length > 0 && this.ignorePrefixChars.includes(processed[0])) {
                processed = processed.substring(1);
            }
            return processed.replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();
        }

        _dispatch(reason, text) {
            this._log(`🎯 Successfully triggered! Reason: ${reason}`);
            this.element.dispatchEvent(new CustomEvent(DoubaoVoiceObserver.EVENT_COMPLETE, {
                bubbles: true,
                detail: { text, reason }
            }));
            this._reset();
        }

        _handleEvent(e) {
            // ===== 记录最近一次单字符输入的 keyup =====
            if (e.type === 'keyup' && this.state === FSM.IDLE && !this._isControlKey(e.key) && e.key.length === 1) {
                this.lastKeyupTime = Date.now();
                this._log(`Recorded single-char keyup "${e.key}" at ${this.lastKeyupTime}`);
            }

            if (e.type === 'blur') {
                const text = this._normalizeText(this.element.value);
                if (text.length > 0) {
                    this._dispatch('blur_fallback', text);
                } else {
                    this._reset();
                }
                return;
            }

            if (e.type === 'focus') {
                this._reset();
                return;
            }

            if (this.state === FSM.SILENT_VERIFYING) {
                if (['keydown', 'input', 'beforeinput'].includes(e.type)) {
                    this._log(`❌ Verification interrupted: Manual intervention within 500ms (${e.type})`);
                    this._reset();
                }
                return; 
            }

            switch (this.state) {
                case FSM.IDLE:
                    // 【修改】只有在输入框非逻辑为空时，退格才算作删除流程的开始
                    if (e.type === 'keydown' && e.key === 'Backspace' && !this._isLogicalZero(this.element.value)) {
                        // 如果配置了区间且距离上次单字符输入落在特征区间内，则判定为内部修正，忽略本次退格
                        const now = Date.now();
                        const gap = now - this.lastKeyupTime;
                        if (this.keyupDeleteGapMin > 0 && this.keyupDeleteGapMax > 0 && this.lastKeyupTime > 0
                            && gap >= this.keyupDeleteGapMin && gap <= this.keyupDeleteGapMax) {
                            this._log(`⏳ Backspace ignored: gap matches internal-correction signature (${this.keyupDeleteGapMin}ms ≤ ${gap}ms ≤ ${this.keyupDeleteGapMax}ms)`);
                            break;  // 不进入删除状态
                        }
                        this.state = FSM.DELETING;
                        this._log("Feature matching started: Entering continuous backspace");
                    }
                    break;

                case FSM.DELETING:
                    if (['beforeinput', 'input'].includes(e.type) && e.inputType === 'deleteContentBackward') {
                    } else if (e.type === 'selectionchange') {
                    } else if (e.type === 'keyup' && e.key === 'Backspace') {
                        this.state = FSM.WAIT_ZERO;
                        this._log("Backspace keyup: Waiting for logical zero");
                    } else {
                        this._reset();
                    }
                    break;

                case FSM.WAIT_ZERO:
                    // 【修改】使用 _isLogicalZero 替代 length === 0
                    if (e.type === 'selectionchange' && this._isLogicalZero(this.element.value)) {
                        this.state = FSM.INJECTING; 
                        this._log("✅ Logical zero verified: Waiting for long text injection");
                    } else if (e.type === 'keydown' && e.key.length > 1 && !this._isControlKey(e.key) && this._isLogicalZero(this.element.value)) {
                        this.expectedText = e.key;
                        this.state = FSM.INJECTING;
                        this._log(`Long text Key received: length ${e.key.length}`);
                    } else {
                        this._reset();
                    }
                    break;

                case FSM.INJECTING:
                    if (e.type === 'keydown' && e.key.length > 1 && !this._isControlKey(e.key)) {
                        this.expectedText = e.key; 
                    } else if (['beforeinput', 'input'].includes(e.type) && ['insertText', 'insertParagraph'].includes(e.inputType)) {
                    } else if (e.type === 'selectionchange') {
                    } else if (e.type === 'keyup') {
                        // 预期的 key 和实际 value 都走一遍 _normalizeText，抹平那 1 个残留标点带来的差异
                        const normExpected = this._normalizeText(this.expectedText);
                        const normCurrent = this._normalizeText(this.element.value);
                        
                        if (e.key === this.expectedText && normExpected === normCurrent) {
                            this.state = FSM.SILENT_VERIFYING;
                            this._log("✅ Injection verified: Starting 500ms silent countdown");
                            
                            this.timer = setTimeout(() => {
                                // 抛出被规范化后的干净文本
                                this._dispatch('fsm_match', normCurrent);
                            }, 500);
                        } else {
                            this._log("❌ Injection verification failed: Text mismatch");
                            this._reset();
                        }
                    } else {
                        this._reset();
                    }
                    break;
            }
        }

        // static listen 的参数也同步放宽，以支持传递配置对象
        static listen(element, onComplete, options = {}) {
            const instance = new DoubaoVoiceObserver(element, options);
            
            const handler = (e) => {
                onComplete(e.detail.text, e.detail.reason);
            };
            element.addEventListener(DoubaoVoiceObserver.EVENT_COMPLETE, handler);

            return {
                destroy: () => {
                    element.removeEventListener(DoubaoVoiceObserver.EVENT_COMPLETE, handler);
                    instance.destroy();
                },
                instance
            };
        }
    }

    // ========== 1.2 跨平台统一语音输入观察者 (Wrapper) ==========
    class UnifiedVoiceInputObserver {
        constructor(element, onTriggered) {
            this.element = element;
            this.onTriggered = onTriggered; // callback(text, reason)
            
            // 检测是否为 iOS
            this.isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            
            this._compStart = this._compStart.bind(this);
            this._compEnd = this._compEnd.bind(this);
            this._doubaoComplete = this._doubaoComplete.bind(this);

            this.init();
        }

        init() {
            if (this.isIOS) {
                this.doubaoObserver = new DoubaoVoiceObserver(this.element,
                    {keyupDeleteGap: {min: 500, max: 700}}
                );
                this.element.addEventListener(DoubaoVoiceObserver.EVENT_COMPLETE, this._doubaoComplete);
            } else {
                this.element.addEventListener('compositionstart', this._compStart);
                this.element.addEventListener('compositionend', this._compEnd);
            }
        }

        _compStart() {
            // 保留内部组装状态（需要时可查）
            this.isComposing = true;
        }

        _compEnd() {
            this.isComposing = false;
            // Android 触发：加 30ms 延迟保证输入框值已更新进入 textarea
            setTimeout(() => {
                const text = this.element.value.trim();
                if (text.length > 0) {
                    this.onTriggered(text, 'compositionend');
                }
            }, 30);
        }

        _doubaoComplete(e) {
            const { text, reason } = e.detail;
            if (text.trim().length > 0) {
                this.onTriggered(text, reason);
            }
        }

        destroy() {
            if (this.isIOS) {
                this.element.removeEventListener(DoubaoVoiceObserver.EVENT_COMPLETE, this._doubaoComplete);
                if (this.doubaoObserver) this.doubaoObserver.destroy();
            } else {
                this.element.removeEventListener('compositionstart', this._compStart);
                this.element.removeEventListener('compositionend', this._compEnd);
            }
        }
    }

    // ========== 2. 配置管理器 ==========
    class ConfigManager {
        constructor(defaults) {
            this.config = { ...defaults };
            this.listeners = new Map();
        }
        get(key) { return this.config[key]; }
        set(key, value) {
            const oldValue = this.config[key];
            if (oldValue === value) return;
            this.config[key] = value;
            this._notify(key, value, oldValue);
        }
        updateMany(newConfig) {
            Object.entries(newConfig).forEach(([key, value]) => this.set(key, value));
        }
        on(key, callback) {
            if (!this.listeners.has(key)) this.listeners.set(key, []);
            this.listeners.get(key).push(callback);
        }
        _notify(key, newVal, oldVal) {
            const callbacks = this.listeners.get(key) || [];
            callbacks.forEach(cb => cb(newVal, oldVal));
        }
    }
    const DEFAULT_CONFIG = { maxHistory: 50 };
    const appConfig = new ConfigManager(DEFAULT_CONFIG);

    // ========== 3. 聊天记录管理器 ==========
    class ChatListManager {
        constructor(containerElement, configManager) {
            this.container = containerElement;
            this.config = configManager;
            this.maxHistory = this.config.get('maxHistory');
            this.config.on('maxHistory', (newVal) => {
                this.maxHistory = newVal;
                this.trimToLimit();
            });
        }
        addMessage(text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            msgDiv.textContent = text;
            this.container.appendChild(msgDiv);
            this.trimToLimit();
            this.scrollToBottom();
            return msgDiv;
        }
        trimToLimit() {
            const messages = Array.from(this.container.querySelectorAll('.message'));
            const excess = messages.length - this.maxHistory;
            if (excess > 0) {
                for (let i = 0; i < excess; i++) {
                    messages[i].remove();
                }
            }
        }
        scrollToBottom() {
            const doScroll = () => {
                this.container.scrollTop = this.container.scrollHeight;
            };
            doScroll();
            requestAnimationFrame(doScroll);
            setTimeout(doScroll, 30);
            setTimeout(doScroll, 150);
        }
        getAllMessages() {
            return Array.from(this.container.querySelectorAll('.message'));
        }
    }

    // ========== 4. WebSocket 客户端 ==========
    // CryptoProvider 类（NaClBoxProvider, XChaCha20Provider, PlainProvider, PROVIDER_CLASSES）
    // 定义在 crypto_providers.js 中，通过 <script src> 加载。
    // SecureClient 负责协调：URL 解析、算法选择、base64 编码、消息组装
    class SecureClient {
        constructor() {
            this._provider = null;
            this._pcPublicKeyB64 = null;
            this._pcPublicKeyRaw = null;
            this._selectedAlgo = 'none';
            this._ready = false;
            this._authenticated = false;
            this._b64Variant = null;
            // 防重放 seq 由 CryptoProvider 内部承载（AAD/前缀），此处不感知
        }
        get needsAuth() { return this._pcPublicKeyB64 !== null; }
        get isEncrypted() { return this._selectedAlgo !== 'none'; }
        get isAuthenticated() { return this._authenticated; }
        // 服务端下发的算法列表与本地无交集（版本不匹配等），无法建立加密通道
        get algoUnsupported() { return this._selectedAlgo === null; }

        async init() {
            await sodium.ready;
            this._ready = true;
            this._b64Variant = sodium.base64_VARIANT_URLSAFE_NO_PADDING;
            this._parseUrlFragment();
            if (this._selectedAlgo === null) {
                console.error('[SEC] No common algorithm with server');
                return;
            }
            this._createProvider();
            if (this._provider.initKeypair) this._provider.initKeypair();
            if (this._pcPublicKeyRaw) this._provider.setPcPublicKey(this._pcPublicKeyRaw);
            console.log('[SEC] sodium ready, algorithm:', this._selectedAlgo);
        }

        _parseUrlFragment() {
            const hash = location.hash;
            const kMatch = hash.match(/[#&]k=([^&]+)/);
            if (kMatch) this._pcPublicKeyB64 = kMatch[1];
            const aMatch = hash.match(/[#&]a=([^&]+)/);
            // a= 为服务端支持的算法优先级列表（逗号分隔），按序选择第一个自身支持的
            const offered = aMatch ? aMatch[1].split(',').map(s => s.trim()) : ['none'];
            this._selectedAlgo = this._selectAlgorithm(offered);
        }

        _selectAlgorithm(offered) {
            for (const name of offered) {
                if (name in PROVIDER_CLASSES) return name;
            }
            return null; // 无共同支持的算法
        }

        _createProvider() {
            const Cls = PROVIDER_CLASSES[this._selectedAlgo];
            this._provider = new Cls();
            if (this._pcPublicKeyB64) {
                if (this._selectedAlgo === 'none') {
                    this._provider.setToken(this._pcPublicKeyB64);
                } else {
                    this._pcPublicKeyRaw = sodium.from_base64(this._pcPublicKeyB64, this._b64Variant);
                }
            }
        }

        _toB64(bytes) { return sodium.to_base64(bytes, this._b64Variant); }
        _fromB64(str) { return sodium.from_base64(str, this._b64Variant); }

        makeAuth() {
            const auth = { type: 'auth' };
            // 每个连接是独立会话：握手开始时归零 Provider 内部 seq 计数器
            //（服务端每连接新建 Provider，从 0 计数，两端必须对齐）
            if (this._provider && this._provider.reset) this._provider.reset();
            const authData = this._provider.makeAuthData();
            if (authData instanceof Uint8Array) {
                // 加密模式：密封 blob 内含 {"algo","pk"}，线上不泄露算法
                // msgpack 原生 bin 类型，密文直接入帧，不再 base64 包裹
                auth.data = authData;
            } else if (authData) {
                // none+CF：token 明文携带，无密封层，需标明 algo=none
                auth.algo = 'none';
                auth.data = authData;
            }
            return auth;
        }

        handleAuthAck(rawBytes) {
            // 成功 ack = 整帧加密（服务端会话密钥已建立）；失败 ack = 明文 msgpack
            //（服务端无会话密钥可加密，只能明文 rejected + 关闭）。
            if (this.isEncrypted) {
                // 加密模式：先走统一解密路径（seq=0 校验并推进 _rxSeq）
                if (this._provider.handleAuthAck(rawBytes)) {
                    this._authenticated = true;
                    console.log('[SEC] Authenticated by server');
                    return true;
                }
                // 解密失败 → 明文 rejected 帧；无法识别同样按失败处理
                try {
                    const msg = MessagePack.decode(rawBytes);
                    if (msg && msg.rejected) {
                        console.error('[SEC] Auth rejected:', msg.reason);
                        return false;
                    }
                } catch (e) { /* 非 msgpack，按无法识别处理 */ }
                return false;
            }
            // 明文模式（none+CF）：ack 一律明文 msgpack
            try {
                const msg = MessagePack.decode(rawBytes);
                if (msg && msg.type === 'auth_ack') {
                    if (msg.rejected) {
                        console.error('[SEC] Auth rejected:', msg.reason);
                        return false;
                    }
                    this._authenticated = true;
                    console.log('[SEC] Authenticated by server');
                    return true;
                }
            } catch (e) { /* 非 msgpack，按无法识别处理 */ }
            return false;
        }

        encrypt(msg) {
            // 产出线上字节：加密模式整帧加密，明文模式直接 msgpack 编码。
            // 无外层信封——是否加密由会话状态机决定，不靠帧内容判别。
            const pt = MessagePack.encode(msg);
            if (!this.isEncrypted) return pt;
            // seq 由 Provider 在加密层自动打上，不进应用层报文
            return this._provider.encrypt(pt);
        }

        decrypt(rawBytes) {
            // 还原应用层报文：加密帧先解密，明文帧直接解码。
            // 重放/乱序/篡改由 Provider 校验并抛错，此处不重复检查。
            if (!this.isEncrypted) return MessagePack.decode(rawBytes);
            const pt = this._provider.decrypt(rawBytes);
            return MessagePack.decode(pt);
        }
    }

    class WSClient {
        constructor(url, configManager) {
            this.url = url;
            this.config = configManager;
            this.ws = null;
            this.isConnected = false;
            this.reconnectInterval = 1000;
            this.connectTimeout = 3000;
            this.reconnectTimer = null;
            this._connectTimer = null;
            this._skipNextDelay = false;
            this.authRejected = false;
            this.messageHandlers = new Map();
            this.secure = new SecureClient();
        }
        on(type, handler) { this.messageHandlers.set(type, handler); }

        _setDebugStatus(text) {
            const statusBar = document.getElementById('status-bar');
            if (statusBar) {
                statusBar.style.display = 'block';
                statusBar.classList.remove('loading');
                statusBar.classList.add('debug');
                statusBar.innerText = text;
            }
        }

        _clearConnectTimer() {
            if (this._connectTimer) {
                clearTimeout(this._connectTimer);
                this._connectTimer = null;
            }
        }

        async connect() {
            if (this.authRejected) return;
            if (this.ws && (this.ws.readyState === WebSocket.OPEN || this.ws.readyState === WebSocket.CONNECTING)) return;
            // 服务端算法列表与本地无交集：重试结果相同，直接提示重新扫码
            if (this.secure.algoUnsupported) {
                this._showAuthRejected(false);
                return;
            }
            // 加密模式但 URL 中没有密钥（如浏览器丢失 hash）：重连无法恢复，直接提示重新扫码
            if (this.secure.isEncrypted && !this.secure.needsAuth) {
                this._showAuthRejected(false);
                return;
            }
            const t0 = Date.now();
            this._setDebugStatus(t('dbg_connect_start'));
            this._clearConnectTimer();
            try {
                this.ws = new WebSocket(this.url);
                // 协议走 binary 帧（msgpack），文本帧一律不予处理
                this.ws.binaryType = 'arraybuffer';
                this._setDebugStatus(t('dbg_handshake_wait'));

                // 连接超时：3 秒内没握手成功就主动放弃，快速失败以便下一轮重试
                this._connectTimer = setTimeout(() => {
                    const elapsed = Date.now() - t0;
                    console.warn(`[WS] Connection timeout after ${elapsed}ms, closing`);
                    this._setDebugStatus(t('dbg_timeout', {ms: elapsed}));
                    if (this.ws) {
                        try { this.ws.close(); } catch(e) {}
                    }
                }, this.connectTimeout);

                this.ws.onopen = () => {
                    this._clearConnectTimer();
                    const t1 = Date.now();
                    console.log(t('log_ws_connected'), `(${t1 - t0}ms)`);
                    this._setDebugStatus(t('dbg_handshake_ok', {ms: t1 - t0}));
                    if (this.reconnectTimer) clearTimeout(this.reconnectTimer);
                    if (this.secure.needsAuth) {
                        const authMsg = this.secure.makeAuth();
                        this.ws.send(MessagePack.encode(authMsg));
                        // algo 在密封 blob 内，线上不可见；此处仅记录本地协商结果
                        console.log('[SEC] Auth sent, algo:', this.secure._selectedAlgo);
                    } else {
                        this.isConnected = true;
                        const t2 = Date.now();
                        this._setDebugStatus(t('dbg_ready_plain', {ms: t2 - t0}));
                        this._notifyStatusChange(true);
                    }
                };
                this.ws.onmessage = (event) => {
                    try {
                        const rawBytes = new Uint8Array(event.data);

                        // 已发 auth、尚未确认：等待的是 auth_ack（成功=密文 / 拒绝=明文 msgpack）
                        if (!this.isConnected && this.secure.needsAuth) {
                            const t2 = Date.now();
                            if (this.secure.handleAuthAck(rawBytes)) {
                                this.isConnected = true;
                                this._setDebugStatus(t('dbg_auth_ok', {ms: t2 - t0}));
                                this._notifyStatusChange(true);
                            } else {
                                // 密钥不匹配（如旧二维码），重试结果相同：停止自动重连并提示重新扫码
                                this.authRejected = true;
                                this._showAuthRejected(true);
                                this.ws.close();
                            }
                            return;
                        }

                        // 已认证：下行数据帧（加密=裸密文，明文=msgpack），解密失败即丢弃
                        let inner;
                        try {
                            inner = this.secure.decrypt(rawBytes);
                        } catch (e) {
                            console.error('[SEC] Decrypt failed:', e);
                            return;
                        }

                        if (!this.isConnected) {
                            this.isConnected = true;
                            this._notifyStatusChange(true);
                        }
                        const handler = this.messageHandlers.get(inner.type);
                        if (handler) handler(inner);
                        else console.warn(t('log_ws_unknown_type'), inner.type);
                    } catch (err) { console.error(t('log_ws_parse_error'), err); }
                };
                this.ws.onclose = () => {
                    this._clearConnectTimer();
                    const t3 = Date.now();
                    console.log(t('log_ws_disconnected'), `(${t3 - t0}ms)`);
                    this.isConnected = false;
                    this.secure._authenticated = false;
                    if (this.authRejected) return; // 保持认证失败提示，不再自动重连
                    this._setDebugStatus(t('dbg_closed', {ms: this.reconnectInterval}));
                    this._notifyStatusChange(false);
                    this._scheduleReconnect();
                };
                this.ws.onerror = (err) => {
                    const t4 = Date.now();
                    console.error('WS error at', t4 - t0, 'ms:', err);
                    this._setDebugStatus(t('dbg_error', {ms: t4 - t0}));
                    this.ws.close();
                };
            } catch (err) {
                this._clearConnectTimer();
                console.error(err);
                this._scheduleReconnect();
            }
        }
        _scheduleReconnect() {
            if (this.reconnectTimer) clearTimeout(this.reconnectTimer);
            if (this._skipNextDelay) {
                this._skipNextDelay = false;
                this.connect();
            } else {
                this.reconnectTimer = setTimeout(() => this.connect(), this.reconnectInterval);
            }
        }
        _notifyStatusChange(connected, message) {
            document.dispatchEvent(new CustomEvent('ws-status', { detail: { connected, message } }));
        }
        _showAuthRejected(hasKey) {
            let text = hasKey ? t('auth_rejected_text') : t('auth_nokey_text');
            // 仅"页面缺少密钥"与微信内置浏览器丢失 hash 相关，认证失败与浏览器无关不提示
            if (!hasKey && /MicroMessenger/i.test(navigator.userAgent)) {
                text += '。' + t('auth_wechat_hint');
            }
            this._notifyStatusChange(false, text);
        }
        _showRescanRequired() {
            // PC 端配置变更与浏览器无关，不追加微信提示
            this._notifyStatusChange(false, t('auth_reconfig_text'));
        }
        /**
         * 发送一个完整帧（字段平铺在帧顶层，不加 payload 包装）。
         * 鼠标/键盘面板走这里：{type:"mouse", a:"click", btn:"left"}。
         */
        sendFrame(frame) {
            if (!this.isConnected || !this.ws || this.ws.readyState !== WebSocket.OPEN) return false;
            // encrypt 已产出线上字节（加密=密文 / 明文=msgpack），直接上帧
            this.ws.send(this.secure.encrypt(frame));
            return true;
        }
        send(type, text) {
            return this.sendFrame({ type, text });
        }
        getConnected() { return this.isConnected; }
    }

    // ========== 5. 消息交互管理器 ==========
    class MessageInteractionManager {
        constructor(chatContainer, uiController, wsClient) {
            this.container = chatContainer;
            this.ui = uiController;
            this.wsClient = wsClient;
            this.pressTimer = null;
            this.longPressTriggered = false;
            this.currentMsg = null;
            this.init();
        }
        init() {
            this.container.addEventListener('touchstart', this._onStart.bind(this), { passive: false });
            this.container.addEventListener('touchend', this._onEnd.bind(this));
            this.container.addEventListener('touchmove', this._onCancel.bind(this));
            this.container.addEventListener('touchcancel', this._onCancel.bind(this));
            this.container.addEventListener('mousedown', this._onStart.bind(this));
            this.container.addEventListener('mouseup', this._onEnd.bind(this));
            this.container.addEventListener('mouseleave', this._onCancel.bind(this));
            this.container.addEventListener('click', (e) => {
                const msg = e.target.closest('.message');
                if (!msg) return;
                if (this.longPressTriggered) {
                    this.longPressTriggered = false;
                    return;
                }
                if (!this.wsClient.getConnected()) return;
                if (confirm(t('confirm_resend'))) {
                    this.ui.sendExternalMessage(msg.textContent);
                }
            });
        }
        _onStart(e) {
            const msg = e.target.closest('.message');
            if (!msg) return;
            this.currentMsg = msg;
            this.currentMsg.classList.add('active');
            this.longPressTriggered = false;
            this.pressTimer = setTimeout(() => {
                if (this.currentMsg && this.wsClient.getConnected()) {
                    const addedText = this.currentMsg.textContent;
                    const currentInput = this.ui.inputBox.value;
                    const newValue = currentInput + addedText;
                    this.ui.inputBox.value = newValue;
                    this.ui.adjustHeight();
                    this.ui.wsClient.send('preview', newValue);
                    this.ui.updateModeToggleVisibility();
                    if (navigator.vibrate) navigator.vibrate(30);
                    this.longPressTriggered = true;
                }
                this._clearHighlight();
            }, 500);
        }
        _onEnd(e) {
            if (this.pressTimer) clearTimeout(this.pressTimer);
            this._clearHighlight();
            if (this.longPressTriggered) {
                if (e.cancelable) e.preventDefault();
                this.ui.inputBox.focus();
                this.longPressTriggered = false;
            }
            this.currentMsg = null;
        }
        _onCancel() {
            if (this.pressTimer) clearTimeout(this.pressTimer);
            this._clearHighlight();
            this.longPressTriggered = false;
            this.currentMsg = null;
        }
        _clearHighlight() {
            if (this.currentMsg) this.currentMsg.classList.remove('active');
        }
    }

    // ========== 6. UI 控制器 ==========
    class UIController {
        constructor(inputElement, sendButton, clearButton, modeToggleButton, chatManager, wsClient, configManager) {
            this.inputBox = inputElement;
            this.btnSend = sendButton;
            this.btnClear = clearButton;
            this.modeToggle = modeToggleButton;
            this.chatManager = chatManager;
            this.wsClient = wsClient;
            this.config = configManager;
            this.autoMode = true;
            this.unifiedVoiceObserver = null;
            this.btnPlus = document.getElementById('btn-plus');
            this.panel = window._accessoryPanel;
            this.panelTabs = document.getElementById('panel-tabs');

            this.btnClear.setAttribute('aria-label', t('btn_clear_aria'));
            this.initEventListeners();
            this.updateSendButtonUI();
            this.updateModeToggleVisibility();
        }

        initEventListeners() {
            this.inputBox.addEventListener('input', () => {
                if (!this.wsClient.getConnected()) return;
                this.adjustHeight();
                this.wsClient.send('preview', this.inputBox.value);
                this.updateModeToggleVisibility();
                this.updatePlusSendVisibility();
            });

            // 跨平台统一语音特征检测
            this.unifiedVoiceObserver = new UnifiedVoiceInputObserver(this.inputBox, (text, reason) => {
                if (this.autoMode && this.wsClient.getConnected() && this.inputBox.value.trim() !== '') {
                    this.sendCurrentMessage(text);
                }
            });

            this.btnSend.addEventListener('click', (e) => {
                if (!this.wsClient.getConnected()) return;
                e.preventDefault();
                this.sendCurrentMessage();
                this.inputBox.focus();
            });

            this.btnPlus.addEventListener('click', (e) => {
                if (!this.wsClient.getConnected()) return;
                e.preventDefault();
                this.showAccessoryPanel();
            });

            this.inputBox.addEventListener('keydown', (e) => {
                if (!this.wsClient.getConnected()) return;
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    this.sendCurrentMessage();
                }
            });

            this.btnClear.addEventListener('click', () => {
                if (!this.wsClient.getConnected()) return;
                this.inputBox.value = '';
                this.adjustHeight();
                this.wsClient.send('preview', '');
                this.updateModeToggleVisibility();
                this.updatePlusSendVisibility();
                this.inputBox.focus();
            });
            this.btnClear.addEventListener('touchstart', (e) => { e.preventDefault(); this.btnClear.click(); });

            this.modeToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!this.wsClient.getConnected()) return;
                this.autoMode = !this.autoMode;
                this.updateSendButtonUI();
                if (navigator.vibrate) navigator.vibrate(30);
                this.updateModeToggleVisibility();
                this.inputBox.focus();
            });
            
            this.inputBox.addEventListener('focus', () => {
                this.hideAccessoryPanel();
                this.chatManager.scrollToBottom();
                setTimeout(() => this.chatManager.scrollToBottom(), 50);
                setTimeout(() => this.chatManager.scrollToBottom(), 150);
                setTimeout(() => this.chatManager.scrollToBottom(), 300);
            });

            document.addEventListener('ws-status', (e) => this.onConnectionChange(e.detail.connected, e.detail.message));
            this.setupScrollFix();
        }

        destroy() {
            if (this.unifiedVoiceObserver) {
                this.unifiedVoiceObserver.destroy();
                this.unifiedVoiceObserver = null;
            }
        }

        sendExternalMessage(text) {
            if (!text.trim()) return;
            this.wsClient.send('send', text);
            this.chatManager.addMessage(text);
        }
        sendCurrentMessage(text) {
            if (!text) text = this.inputBox.value;
            this.sendExternalMessage(text);
            this.inputBox.value = '';
            this.adjustHeight();
            this.wsClient.send('preview', '');
            this.updateModeToggleVisibility();
            this.updatePlusSendVisibility();
        }
        adjustHeight() {
            this.inputBox.style.height = 'auto';
            this.inputBox.style.height = this.inputBox.scrollHeight + 'px';
            this.chatManager.scrollToBottom();
        }
        updateSendButtonUI() {
            if (this.autoMode) {
                this.btnSend.textContent = t('btn_send_auto');
                document.body.classList.add('auto-mode');
                this.inputBox.placeholder = t('input_placeholder_auto');
            } else {
                this.btnSend.textContent = t('btn_send_manual');
                document.body.classList.remove('auto-mode');
                this.inputBox.placeholder = t('input_placeholder_manual');
            }
            this.updatePlusSendVisibility();
        }
        updateModeToggleVisibility() {
            if (!this.wsClient.getConnected()) {
                this.modeToggle.style.display = 'none';
                return;
            }
            this.modeToggle.style.display = (this.inputBox.value.trim() === '') ? 'block' : 'none';
        }
        updatePlusSendVisibility() {
            if (!this.wsClient.getConnected()) {
                this.btnPlus.style.display = 'none';
                this.btnSend.style.display = 'none';
                return;
            }
            const hasText = this.inputBox.value.trim() !== '';
            this.btnPlus.style.display = hasText ? 'none' : 'flex';
            this.btnSend.style.display = hasText ? 'flex' : 'none';
        }
        showAccessoryPanel() {
            if (this.panel.isVisible) {
                // 面板可见 → 收起面板（回到键盘输入）
                this.hideAccessoryPanel();
                this.inputBox.focus();
                return;
            }
            // 面板不可见 → 显示面板（收起键盘），并露出子面板切换条
            this.panel.show();
            this.panelTabs.classList.remove('hidden');
            this.inputBox.blur();
            if (window._adjustViewport) window._adjustViewport();
        }
        hideAccessoryPanel() {
            // 输入框获得焦点 → 面板与切换条一起隐藏
            this.panelTabs.classList.add('hidden');
            this.panel.hide();
        }
        onConnectionChange(connected, message, type) {
            const statusBar = document.getElementById('status-bar');
            const chatListDiv = document.getElementById('chat-list');
            if (connected) {
                statusBar.style.display = 'none';
                statusBar.classList.remove('loading');
                statusBar.classList.remove('debug');
                chatListDiv.classList.remove('offline');
                this.inputBox.disabled = false;
                this.btnSend.disabled = false;
                this.btnPlus.disabled = false;
                this.btnClear.disabled = false;
                this.modeToggle.disabled = false;
                this.updateSendButtonUI();
                this.updateModeToggleVisibility();
            } else {
                statusBar.style.display = 'block';
                statusBar.innerText = message || t('status_disconnected_text');
                statusBar.classList.toggle('loading', type === 'loading');
                statusBar.classList.remove('debug');
                chatListDiv.classList.add('offline');
                this.inputBox.disabled = true;
                this.btnSend.disabled = true;
                this.btnPlus.disabled = true;
                this.btnPlus.style.display = 'none';
                this.btnClear.disabled = true;
                this.modeToggle.disabled = true;
                this.modeToggle.style.display = 'none';
                this.inputBox.placeholder = t('input_placeholder_disconnected');
            }
        }
        setupScrollFix() {
            const resetViewport = () => {
                window.scrollTo(0, 0);
                this.chatManager.scrollToBottom();
            };
            this.inputBox.addEventListener('blur', resetViewport);
            document.addEventListener('focusout', (e) => {
                if (!this.inputBox.contains(e.relatedTarget)) {
                    resetViewport();
                }
            });
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) {
                    resetViewport();
                }
            });
            window.addEventListener('popstate', resetViewport);
        }
    }

    // ========== 6. 附件面板：子面板切换 + 鼠标摇杆 ==========

    /**
     * 子面板切换条（鼠标 / 键盘 / 文件）。
     *
     * 必须在 loadI18n() 之后调用：切换条的 aria-label 与各占位文案取自语言包，
     * 语言包未就绪时 t() 只会回退成键名。
     */
    function initPanelTabs() {
        const tabsEl = document.getElementById('panel-tabs');
        const tabButtons = tabsEl ? Array.prototype.slice.call(tabsEl.querySelectorAll('.tab')) : [];
        const views = Array.prototype.slice.call(document.querySelectorAll('#accessory-panel .panel-view'));

        function activatePanel(name) {
            tabButtons.forEach(function (b) {
                b.classList.toggle('active', b.dataset.panel === name);
            });
            views.forEach(function (v) {
                v.classList.toggle('active', v.id === 'view-' + name);
            });
        }
        window._activatePanel = activatePanel; // 供调试与后续对接使用

        tabButtons.forEach(function (b) {
            b.setAttribute('aria-label', t('panel_tab_' + b.dataset.panel));
            b.addEventListener('click', function (e) {
                e.preventDefault();
                activatePanel(this.dataset.panel);
                if (navigator.vibrate) navigator.vibrate(15);
            });
        });

        // 所有带 data-i18n 的占位文案统一回填（鼠标面板的提示由 MouseJoystick 自管）
        document.querySelectorAll('#accessory-panel [data-i18n]').forEach(function (el) {
            el.textContent = t(el.dataset.i18n);
        });
    }

    /**
     * 摇杆子面板：王者荣耀式虚拟摇杆（速度模型）+ 4×4 动作按钮网格。
     *
     * 对应 docs/mouse-joystick-design.md：
     *   - §3.1 方案 A：CSS 由类自带（static get STYLES），选择器挂 .mouse-joystick，零全局污染
     *   - §3.2 解耦原则：不碰 WebSocket，所有输出只走 onCommand(frame) 一个出口
     *   - §4 布局：调参行 / 读数行 / 摇杆 + 按钮网格 / 提示行
     *   - §5.1 帧格式严格对齐 wire-protocol.md §7 的 mouse / key，不发明协议外字段
     */
    class MouseJoystick {
        // 一次性动作按钮（4×4 网格，数组顺序即 DOM 顺序）
        // frame 是完整帧对象（含 type）：鼠标类落 type:"mouse"，按键类落 type:"key"
        static get ACTIONS() {
            return [
                { id: 'left',       i18n: 'panel_btn_left',       frame: { type: 'mouse', a: 'click', btn: 'left' } },
                { id: 'right',      i18n: 'panel_btn_right',      frame: { type: 'mouse', a: 'click', btn: 'right' } },
                { id: 'del',        text: '⌫',                   frame: { type: 'key', keys: 'backspace' } },
                { id: 'enter',      text: 'Enter', cls: 'pv-enter', frame: { type: 'key', keys: 'enter' } },
                { id: 'double',     i18n: 'panel_btn_double',     frame: { type: 'mouse', a: 'double', btn: 'left' } },
                { id: 'drag',       i18n: 'panel_btn_drag', toggle: true },
                { id: 'esc',        text: 'Esc',                  frame: { type: 'key', keys: 'esc' } },
                { id: 'shiftenter', text: '⇧Enter', cls: 'pv-enter', title: 'Shift+Enter', frame: { type: 'key', keys: 'shift+enter' } },
                { id: 'wheelup',    i18n: 'panel_btn_wheel_up',   cls: 'pv-narrow', repeat: true, frame: { type: 'mouse', a: 'wheel', delta: -120 } },
                { id: 'redo',       text: 'Ctrl+Y', cls: 'pv-narrow', frame: { type: 'key', keys: 'ctrl+y' } },
                { id: 'up',         text: '↑',      repeat: true, frame: { type: 'key', keys: 'up' } },
                { id: 'undo',       text: 'Ctrl+Z', cls: 'pv-narrow', frame: { type: 'key', keys: 'ctrl+z' } },
                { id: 'wheeldown',  i18n: 'panel_btn_wheel_down', cls: 'pv-narrow', repeat: true, frame: { type: 'mouse', a: 'wheel', delta: 120 } },
                { id: 'arrleft',    text: '←',      repeat: true, frame: { type: 'key', keys: 'left' } },
                { id: 'arrdown',    text: '↓',      repeat: true, frame: { type: 'key', keys: 'down' } },
                { id: 'arrright',   text: '→',      repeat: true, frame: { type: 'key', keys: 'right' } }
            ];
        }

        static get STYLES() {
            return `
        .mouse-joystick {

        .mouse-joystick .pv-stick {
            flex: 2 2 0;
            min-width: 104px;
            align-self: stretch;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mouse-joystick .pv-stick-base {
            position: relative;
            width: 112px;
            height: 112px;
            border-radius: 50%;
            background: #ffffff;
            border: 1.5px solid #dcdcdc;
            box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.04), 0 2px 8px rgba(0, 0, 0, 0.06);
            touch-action: none;
            flex-shrink: 0;

        .mouse-joystick .pv-cross-v {

            background: #f0f0f0;

            left: 14%;
            right: 14%;
            top: 50%;
            height: 1px;

            bottom: 14%;
            left: 50%;
            width: 1px;

            position: absolute;
            left: 50%;
            top: 50%;
            width: 34%;
            height: 34%;
            margin: -17%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #7bd8c6, #07c160);
            border: 2px solid rgba(7, 193, 96, 0.6);
            box-shadow: 0 0 16px rgba(7, 193, 96, 0.35);
        }
            `;
        }

        constructor(root, options = {}) {
            this.root = root;
            this.onCommand = options.onCommand || function () {};
            this.maxSpeed = options.maxSpeed || 1500;   // px/s 满推速度
            this.deadzone = options.deadzone || 0.12;   // 死区比例

            this.active = false;
            this.dirX = 0;      // 单位方向向量
            this.dirY = 0;
            this.mag = 0;       // 幅度 0~1
            this.dragOn = false;
            this._accX = 0;     // 位移小数余量，跨帧累加避免截断误差
            this._accY = 0;
            this._lastT = 0;
            this._rafId = null;
            this._ro = null;
            this._wheelDelay = null;
            this._wheelTimer = null;

            this._boundLoop = this._loop.bind(this);
            this._boundResize = this._fitStick.bind(this);

            this._injectStyles();
            // 与 TouchpadPanel 同一约定：面板类加在 section 内的独立根容器上，
            // 不污染 section，避免 .mouse-joystick 之类规则干扰 .panel-view 的显隐。
            this.root.innerHTML = '<div class="mouse-joystick"></div>';
            this.root = this.root.querySelector('.mouse-joystick');
            this._buildDOM();
            this._bindPointer();
            this._rafId = requestAnimationFrame(this._boundLoop);
        }

        // ---------- 构建 ----------

        _injectStyles() {
            if (document.getElementById('mouse-joystick-styles')) return;   // 幂等
            const style = document.createElement('style');
            style.id = 'mouse-joystick-styles';
            style.textContent = MouseJoystick.STYLES;
            document.head.appendChild(style);
        }

        _buildDOM() {
            const gridHtml = MouseJoystick.ACTIONS.map(function (act, i) {
                const cls = ['pv-act', act.cls || ''].join(' ').trim();
                const title = act.title ? ' title="' + act.title + '"' : '';
                const label = act.i18n
                    ? '<span data-i18n="' + act.i18n + '"></span>'
                    : act.text;
                return '<button type="button" class="' + cls + '"' + title +
                       ' data-act="' + i + '" data-id="' + act.id + '">' + label + '</button>';
            }).join('');

            this.root.innerHTML = [
                '<div class="pv-tuning">',
                '  <div class="pv-tune">',
                '    <label for="mj-speed" data-i18n="panel_tune_speed"></label>',
                '    <input id="mj-speed" class="pv-speed-range" type="range" min="200" max="3000" step="50">',
                '    <span class="val pv-speed-val"></span>',
                '  </div>',
                '  <div class="pv-tune">',
                '    <label for="mj-dead" data-i18n="panel_tune_dead"></label>',
                '    <input id="mj-dead" class="pv-dead-range" type="range" min="0" max="30">',
                '    <span class="val pv-dead-val"></span>',
                '  </div>',
                '</div>',
                '<div class="pv-readout">',
                '  <span class="pv-readout-label" data-i18n="panel_mag"></span>',
                '  <div class="pv-mag"><div class="pv-mag-fill"></div></div>',
                '  <span class="pv-speed">0 px/s</span>',
                '</div>',
                '<div class="pv-control">',
                '  <div class="pv-stick">',
                '    <div class="pv-stick-base">',
                '      <span class="pv-cross-h"></span><span class="pv-cross-v"></span>',
                '      <div class="pv-knob"></div>',
                '    </div>',
                '  </div>',
                '  <div class="pv-grid">' + gridHtml + '</div>',
                '</div>',
                '<div class="pv-hint" data-i18n="panel_hint_mouse"></div>'
            ].join('');

            // 语言包已由 loadI18n() 就绪，统一回填 data-i18n 文案
            this.root.querySelectorAll('[data-i18n]').forEach(function (el) {
                el.textContent = t(el.dataset.i18n);
            });

            this.base = this.root.querySelector('.pv-stick-base');
            this.knob = this.root.querySelector('.pv-knob');
            this.magFill = this.root.querySelector('.pv-mag-fill');
            this.speedEl = this.root.querySelector('.pv-speed');
            this.dragBtn = this.root.querySelector('[data-id="drag"]');

            this._initTuning();
            this._bindActions();

            // 自适应尺寸：面板由隐藏切为可见时 ResizeObserver 会补一次测量
            if (typeof ResizeObserver !== 'undefined') {
                this._ro = new ResizeObserver(this._boundResize);
                this._ro.observe(this.base.parentElement);
            }
            window.addEventListener('resize', this._boundResize);
            this._fitStick();
        }

        _initTuning() {
            const speedRange = this.root.querySelector('.pv-speed-range');
            const speedVal = this.root.querySelector('.pv-speed-val');
            const deadRange = this.root.querySelector('.pv-dead-range');
            const deadVal = this.root.querySelector('.pv-dead-val');

            speedRange.value = this.maxSpeed;
            speedVal.textContent = this.maxSpeed;
            speedRange.addEventListener('input', () => {
                this.maxSpeed = +speedRange.value;
                speedVal.textContent = this.maxSpeed;
            });

            deadRange.value = Math.round(this.deadzone * 100);
            deadVal.textContent = this.deadzone.toFixed(2);
            deadRange.addEventListener('input', () => {
                this.deadzone = +deadRange.value / 100;
                deadVal.textContent = this.deadzone.toFixed(2);
            });
        }

        // ---------- 输出（唯一出口） ----------

        // dx / dy 是每帧小数位移。沿方向取整（而非按轴独立截断）：pyautogui 只收
        // 整数像素，按轴截断会让慢速 45° 方向某帧只走 x、某帧只走 y，方向漂成纯
        // 水平/纯垂直。沿方向取整保证每帧输出向量方向与累加方向一致、模长精确。
        _emitMove(dx, dy) {
            this._accX += dx;
            this._accY += dy;
            const mag = Math.hypot(this._accX, this._accY);
            if (mag < 1) return;                      // 不足 1px，留到下一帧
            const n = Math.floor(mag);
            const ox = Math.round(this._accX / mag * n);
            const oy = Math.round(this._accY / mag * n);
            this._accX -= ox;                          // 向量减法，方向与模长都守恒
            this._accY -= oy;
            if (ox === 0 && oy === 0) return;
            this.onCommand({ type: 'mouse', a: 'move', dx: ox, dy: oy });
        }

        _emitAction(frame) {
            this.onCommand(frame);
        }

        _setDrag(on) {
            this.dragOn = on;
            if (this.dragBtn) this.dragBtn.classList.toggle('on', on);
            this._emitAction({ type: 'mouse', a: on ? 'down' : 'up', btn: 'left' });
        }

        // ---------- 交互 ----------

        _bindPointer() {
            const base = this.base;
            base.addEventListener('pointerdown', (e) => {
                this.active = true;
                try { base.setPointerCapture(e.pointerId); } catch (err) {}
                this._updateStick(e.clientX, e.clientY);
                this._lastT = performance.now();
                e.preventDefault();
            });
            base.addEventListener('pointermove', (e) => {
                if (!this.active) return;
                this._updateStick(e.clientX, e.clientY);
                e.preventDefault();
            });
            base.addEventListener('pointerup', () => this._endStick());
            base.addEventListener('pointercancel', () => this._endStick());
        }

        _updateStick(clientX, clientY) {
            const rect = this.base.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            let dx = clientX - cx;
            let dy = clientY - cy;
            const dist = Math.hypot(dx, dy);
            const maxR = Math.max(8, (rect.width - this.knob.offsetWidth) / 2);
            if (dist > maxR) {
                // 位置 clamp 到圆边，但方向向量直接用 clamp 后的 dx/dy 除以 maxR，
                // 因此 dirX/dirY 始终是“单位方向”，与手指推出多远无关（sample 算法）。
                dx = dx / dist * maxR;
                dy = dy / dist * maxR;
            }
            this.mag = Math.min(1, dist / maxR);
            this.dirX = dist > 0 ? dx / maxR : 0;
            this.dirY = dist > 0 ? dy / maxR : 0;
            this.knob.style.transition = 'none';
            this.knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
        }

        _endStick() {
            if (!this.active) return;
            this.active = false;
            this.dirX = this.dirY = 0;
            this.mag = 0;
            this._accX = this._accY = 0;
            this.knob.style.transition = 'transform 0.18s ease-out';
            this.knob.style.transform = 'translate(0,0)';
        }

        _bindActions() {
            const self = this;
            this.root.querySelectorAll('.pv-act').forEach(function (el) {
                const act = MouseJoystick.ACTIONS[+el.dataset.act];
                el.addEventListener('pointerdown', function (e) {
                    e.preventDefault();
                    if (navigator.vibrate) navigator.vibrate(10);
                    if (act.toggle) {
                        self._setDrag(!self.dragOn);
                        return;
                    }
                    self._emitAction(act.frame);
                    if (act.repeat) self._startRepeat(act.frame);
                });
                if (act.repeat) {
                    el.addEventListener('pointerup', () => self._stopRepeat());
                    el.addEventListener('pointercancel', () => self._stopRepeat());
                    el.addEventListener('pointerleave', () => self._stopRepeat());
                }
            });
        }

        // 滚轮长按连发：首次立即发，延迟 350ms 后每 140ms 一格
        _startRepeat(frame) {
            this._stopRepeat();
            this._wheelDelay = setTimeout(() => {
                this._wheelTimer = setInterval(() => this._emitAction(frame), 140);
            }, 350);
        }

        _stopRepeat() {
            if (this._wheelDelay) { clearTimeout(this._wheelDelay); this._wheelDelay = null; }
            if (this._wheelTimer) { clearInterval(this._wheelTimer); this._wheelTimer = null; }
        }

        // ---------- 帧循环 ----------

        _loop(now) {
            const dt = Math.min(50, now - this._lastT) / 1000;   // 上限 50ms，防切后台回来跳变
            this._lastT = now;

            let speed = 0;
            if (this.active && this.mag > this.deadzone) {
                // 与 sample 一致：线性曲线。dirX/dirY 已是“单位方向 × 幅度”，
                // eff 做死区归一化后线性映射到 maxSpeed，方向变化线性可感、满推行程恒定。
                const eff = Math.min(1, (this.mag - this.deadzone) / (1 - this.deadzone));
                speed = eff * this.maxSpeed;
                this._emitMove(this.dirX * speed * dt, this.dirY * speed * dt);
            }
            this._updateReadout(speed);
            this._rafId = requestAnimationFrame(this._boundLoop);
        }

        _updateReadout(speed) {
            this.magFill.style.width = (this.mag * 100).toFixed(1) + '%';
            this.speedEl.textContent = Math.round(speed) + ' px/s';
        }

        // 摇杆底座尽量大：占满 .pv-stick 可用区域并保持圆形
        _fitStick() {
            const stick = this.base.parentElement;
            if (!stick) return;
            const w = stick.clientWidth;
            const h = stick.clientHeight;
            if (w < 20 || h < 20) return;   // 面板收起 / 未激活时跳过
            const s = Math.max(88, Math.min(w, h) - 8);
            this.base.style.width = s + 'px';
            this.base.style.height = s + 'px';
        }

        // ---------- 生命周期 ----------

        start() {
            if (this._rafId === null) {
                this._lastT = performance.now();
                this._rafId = requestAnimationFrame(this._boundLoop);
            }
        }

        destroy() {
            if (this._rafId !== null) { cancelAnimationFrame(this._rafId); this._rafId = null; }
            this._stopRepeat();
            if (this._ro) { this._ro.disconnect(); this._ro = null; }
            window.removeEventListener('resize', this._boundResize);
            if (this.root && this.root.parentNode) this.root.parentNode.removeChild(this.root);
        }
    }
