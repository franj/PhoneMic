[project]
name = "phonemic"
version = "0.4.0"
description = "PhoneMic: 手机语音桥接输入法"
authors = [
    {name = "phonemic team"}
]
readme = "README.md"
requires-python = ">=3.13.1,<3.15"
dependencies = [
    "pywin32>=311,<312",
    "pyperclip>=1.11.0,<2.0.0",
    "pyautogui>=0.9.54,<0.10.0",
    "netifaces>=0.11.0,<0.12.0",
    "psutil>=7.2.2,<8.0.0",
    "keyboard>=0.13.5,<0.14.0",
    "pyside6>=6.11.1,<7.0.0",
    "qrcode>=8.2,<9.0",
    "pyparsing>=3.1,<4.0",
    "aiohttp>=3.14,<4.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "isort>=8.0.1,<9.0.0",
    "websockets>=16.0,<17.0",
    "pytest-mock>=3.15.1,<4.0.0",
    "pytest-qt>=4.5.0,<5.0.0",
    "nuitka>=4.1.1,<5.0.0",
    "ordered-set>=4.1.0,<5.0.0",
    "zstandard>=0.25.0,<0.26.0",
    "pyinstaller>=6.20.0,<7.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
]
