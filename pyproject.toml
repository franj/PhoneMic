[project]
name = "phonemic"
version = "0.6.2"
description = "PhoneMic: 手机语音桥接输入法"
authors = [
    {name = "phonemic team"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pywin32>=311,<312",
    "pyperclip>=1.11.0,<2.0.0",
    "pyautogui>=0.9.54,<0.10.0",
    "netifaces>=0.11.0,<0.12.0",
    "psutil>=7.2.2,<8.0.0",
    "pyside6>=6.11.1,<7.0.0",
    "qrcode>=8.2,<9.0",
    "pyparsing>=3.1,<4.0",
    "starlette>=1.6.0,<1.7.0",
    "uvicorn[standard]>=0.47.0,<0.48.0",
    "pynacl>=1.6.0,<2.0.0",
    "msgpack>=1.2.2",
    "markdown-it-py>=4.2.0",
]

[project.scripts]
app = "phonemic.PhoneMic:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "isort>=8.0.1,<9.0.0",
    "websockets>=16.0,<17.0",
    "pytest-mock>=3.15.1,<4.0.0",
    "pytest-qt>=4.5.0,<5.0.0",
    "nuitka>=4.1.1,<5.0.0",
    "ordered-set>=4.1.0,<5.0.0",
    "zstandard>=0.25.0,<0.26.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-playwright>=0.7.0,<1.0.0",
    "pytest-xdist>=3.8.0",
]

# 全量就这么跑：`uv run pytest`。1165 条 25 秒（串行 103 秒）。
#
# 为什么并行度写死 4 而不是 -n auto：auto 按核数开（开发机 22 核），而每个 worker
# 都要拉一个 chromium，二十几个浏览器反而更慢、还把 10G 可用内存吃光。
# 8 是开发机器实测的甜点（-n 4 = 32s，-n 8 = 25s，再往上收益归零），但考虑4足够。
#
# 什么情况下加 -n0：跑单个文件、要看真实执行顺序、要下断点（xdist 下断点不会命中）。
# 这是唯一的例外，其余时候不用记参数。
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n 4 -ra --durations=10"
